<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TRAIL おやこダッシュボード</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#faf7f2;--bg-card:#ffffff;--bg-card-alt:#fef9ef;
  --sage:#7a9e7e;--sage-light:#e8f0e9;--sage-dark:#5a7e5e;
  --gold:#c8a04a;--gold-light:#fdf3d7;--gold-dark:#a07828;
  --cream:#f5eed6;--cream-dark:#e8ddb8;
  --brown:#6b5443;--brown-light:#8b7463;
  --text:#3d3428;--text-dim:#8a7e6d;--text-light:#b0a594;
  --accent:#d4896a;--accent-light:#fbe8df;
  --border:rgba(107,84,67,0.1);
  --shadow:0 2px 12px rgba(107,84,67,0.08);
  --radius:14px;
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding:16px 16px 80px;min-height:100vh}

/* ── Skeleton ── */
.skeleton{background:linear-gradient(90deg,#eee8dd 25%,#f5eed6 50%,#eee8dd 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;min-height:20px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-block{height:120px;border-radius:var(--radius);margin-bottom:16px}
.skeleton-line{height:16px;margin-bottom:10px;width:80%}
.skeleton-line.short{width:50%}

/* ── Header ── */
.header{display:flex;align-items:center;gap:12px;padding:20px 0 16px}
.header-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--sage),var(--sage-dark));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#fff;font-weight:900}
.header-text h1{font-size:1rem;font-weight:900;color:var(--sage-dark);letter-spacing:.5px}
.header-text p{font-size:.7rem;color:var(--text-dim);font-weight:500}

/* ── Student Card ── */
.student-card{background:linear-gradient(135deg,var(--sage),var(--sage-dark));border-radius:var(--radius);padding:24px 20px;color:#fff;margin-bottom:20px;position:relative;overflow:hidden}
.student-card::after{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;background:rgba(255,255,255,0.08);border-radius:50%}
.student-card::before{content:'';position:absolute;bottom:-20px;left:-20px;width:80px;height:80px;background:rgba(255,255,255,0.05);border-radius:50%}
.student-row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.student-avatar{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;border:2px solid rgba(255,255,255,0.3)}
.student-info h2{font-size:1.2rem;font-weight:900}
.student-info .class-badge{display:inline-block;background:rgba(255,255,255,0.2);padding:2px 10px;border-radius:20px;font-size:.7rem;font-weight:500;margin-top:4px}
.student-info .days-badge{display:inline-block;background:var(--gold);color:var(--text);padding:2px 10px;border-radius:20px;font-size:.65rem;font-weight:700;margin-left:6px}
.student-info .rank-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.25);padding:4px 12px;border-radius:20px;font-size:.7rem;font-weight:700;margin-top:6px}
.rank-letter{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.3);font-size:.75rem;font-weight:900}

/* ── Section Title ── */
.section-title{font-size:.75rem;font-weight:700;color:var(--text-dim);margin:24px 0 10px;display:flex;align-items:center;gap:6px}
.section-title span{font-size:.95rem}

/* ── Card ── */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-empty{padding:24px;text-align:center;color:var(--text-dim);font-size:.85rem}

/* ── Stats Tabs ── */
.stats-tabs{display:flex;gap:0;background:var(--cream);border-radius:10px;padding:3px;margin-bottom:12px}
.stats-tab{flex:1;text-align:center;padding:8px 0;font-size:.75rem;font-weight:700;border-radius:8px;cursor:pointer;color:var(--text-dim);transition:all .2s}
.stats-tab.active{background:var(--bg-card);color:var(--sage-dark);box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px 8px;text-align:center;box-shadow:var(--shadow)}
.stat-value{font-size:1.5rem;font-weight:900;color:var(--sage-dark);margin-bottom:2px}
.stat-label{font-size:.65rem;color:var(--text-dim);font-weight:500}
.stat-value.gold{color:var(--gold-dark)}

/* ── Monthly Summary ── */
.monthly-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.monthly-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.monthly-card .mc-label{font-size:.65rem;color:var(--text-dim);font-weight:500;margin-bottom:6px}
.monthly-card .mc-value{font-size:1.3rem;font-weight:900;color:var(--text)}
.monthly-card .mc-sub{font-size:.65rem;color:var(--text-light);margin-top:4px}
.rank-card{background:linear-gradient(135deg,var(--gold-light),var(--cream));border:1px solid var(--gold);border-radius:12px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.rank-card .rank-pos{font-size:1.6rem;font-weight:900;color:var(--gold-dark)}
.rank-card .rank-label{font-size:.7rem;color:var(--brown);font-weight:700;margin-top:2px}

/* ── Accordion ── */
.accordion{}
.accordion-item{border-bottom:1px solid var(--border)}
.accordion-item:last-child{border-bottom:none}
.accordion-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none}
.accordion-header:hover{background:rgba(122,158,126,0.04)}
.accordion-month{font-size:.8rem;font-weight:700;color:var(--sage-dark)}
.accordion-badge{font-size:.6rem;background:var(--sage-light);color:var(--sage-dark);padding:2px 8px;border-radius:10px;font-weight:700}
.accordion-badge.ai{background:var(--accent-light);color:var(--accent)}
.accordion-arrow{font-size:.65rem;color:var(--text-dim);transition:transform .2s}
.accordion-item.open .accordion-arrow{transform:rotate(180deg)}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.accordion-item.open .accordion-body{max-height:500px}
.accordion-content{padding:0 16px 14px;font-size:.85rem;line-height:1.6;color:var(--text)}

/* ── Calendar ── */
.calendar-grid{padding:12px}
.calendar-header{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:6px}
.calendar-header span{font-size:.6rem;color:var(--text-dim);font-weight:700}
.calendar-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calendar-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:.7rem;border-radius:6px;font-weight:500;color:var(--text-dim);position:relative}
.calendar-day.empty{visibility:hidden}
.calendar-day.has-activity{background:var(--sage-light);color:var(--sage-dark);font-weight:700}
.calendar-day.activity-high{background:var(--sage);color:#fff}
.calendar-day.activity-max{background:var(--sage-dark);color:#fff}
.calendar-day.today{outline:2px solid var(--gold);outline-offset:-1px}

/* ── Category Bars ── */
.category-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.category-item:last-child{border-bottom:none}
.category-name{font-size:.8rem;font-weight:700;width:60px;flex-shrink:0}
.category-bar-wrap{flex:1;background:var(--cream);border-radius:6px;height:20px;overflow:hidden;position:relative}
.category-bar{height:100%;background:linear-gradient(90deg,var(--sage-light),var(--sage));border-radius:6px;transition:width .6s ease;min-width:2px}
.category-pct{font-size:.7rem;font-weight:700;color:var(--text-dim);width:40px;text-align:right;flex-shrink:0}
.category-best{display:inline-block;background:var(--gold-light);color:var(--gold-dark);font-size:.55rem;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:4px}

/* ── Rank Graph ── */
.rank-graph{padding:16px;height:160px;position:relative}
.rank-graph-inner{display:flex;align-items:flex-end;justify-content:space-around;height:100%;gap:8px}
.rank-bar-wrap{display:flex;flex-direction:column;align-items:center;flex:1}
.rank-bar{width:100%;max-width:36px;background:linear-gradient(to top,var(--sage),var(--sage-light));border-radius:8px 8px 0 0;transition:height .5s ease;position:relative}
.rank-bar-value{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:900;color:var(--sage-dark);white-space:nowrap}
.rank-bar-month{font-size:.6rem;color:var(--text-dim);margin-top:6px;font-weight:500}

/* ── Best Scores ── */
.score-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.score-card{background:var(--bg-card-alt);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.score-emoji{font-size:1.6rem;margin-bottom:4px}
.score-name{font-size:.7rem;color:var(--text-dim);font-weight:500;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-value{font-size:1.1rem;font-weight:900;color:var(--gold-dark)}
.score-label{font-size:.6rem;color:var(--text-dim)}

/* ── Goal ── */
.goal-card{background:linear-gradient(135deg,var(--gold-light),var(--cream));border:1px solid var(--gold);border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:16px}
.goal-icon{font-size:2rem;margin-bottom:8px}
.goal-text{font-size:.9rem;font-weight:700;color:var(--brown)}
.goal-empty{color:var(--text-dim);font-size:.8rem}

/* ── Recent Plays ── */
.play-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.play-item:last-child{border-bottom:none}
.play-emoji{font-size:1.2rem;width:28px;text-align:center;flex-shrink:0}
.play-body{flex:1;min-width:0}
.play-name{font-size:.82rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.play-date{font-size:.65rem;color:var(--text-dim);margin-top:1px}
.play-alt{font-size:.8rem;font-weight:900;color:var(--gold-dark);flex-shrink:0}

/* ── Error/Auth screens ── */
.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:24px}
.auth-icon{font-size:3rem;margin-bottom:16px}
.auth-title{font-size:1.1rem;font-weight:900;color:var(--sage-dark);margin-bottom:8px}
.auth-msg{font-size:.85rem;color:var(--text-dim);line-height:1.6;max-width:280px}

/* ── Loading screen ── */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh}
.loading-dots{display:flex;gap:6px;margin-bottom:16px}
.loading-dots span{width:10px;height:10px;border-radius:50%;background:var(--sage);animation:bounce .6s alternate infinite}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{opacity:.3;transform:translateY(-6px)}}
.loading-text{font-size:.8rem;color:var(--text-dim);font-weight:500}

/* ── Utility ── */
.mb-10{margin-bottom:10px}
.mb-16{margin-bottom:16px}

/* ── PINログイン画面 ── */
.pin-login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:24px}
.pin-login-box{width:100%;max-width:340px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;box-shadow:var(--shadow)}
.pin-login-title{font-size:1.1rem;font-weight:900;color:var(--sage-dark);text-align:center;margin-bottom:20px}
.pin-login-input{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:1rem;outline:none;margin-bottom:10px;transition:border-color .3s}
.pin-login-input:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(122,158,126,0.12)}
.pin-login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--sage),var(--sage-dark));border:none;border-radius:10px;color:#fff;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .3s;margin-top:6px}
.pin-login-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(122,158,126,0.25)}
.pin-login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
.pin-login-error{color:#d44;font-size:.8rem;text-align:center;margin-top:10px;min-height:1.2em}

/* ── PIN変更モーダル ── */
.pin-change-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.pin-change-box{width:100%;max-width:340px;background:var(--bg-card);border-radius:var(--radius);padding:24px;box-shadow:0 8px 32px rgba(0,0,0,0.15)}
.pin-change-title{font-size:1rem;font-weight:900;color:var(--sage-dark);margin-bottom:16px;text-align:center}
.pin-change-input{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:1rem;outline:none;margin-bottom:10px;transition:border-color .3s}
.pin-change-input:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(122,158,126,0.12)}
.pin-change-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--sage),var(--sage-dark));border:none;border-radius:10px;color:#fff;font-size:.85rem;font-weight:700;cursor:pointer;margin-top:6px;transition:all .3s}
.pin-change-btn:disabled{opacity:.6;cursor:not-allowed}
.pin-change-cancel{width:100%;padding:10px;background:none;border:1px solid var(--border);border-radius:10px;color:var(--text-dim);font-size:.85rem;cursor:pointer;margin-top:8px}
.pin-change-msg{font-size:.8rem;text-align:center;margin-top:10px;min-height:1.2em}
.pin-change-msg.error{color:#d44}
.pin-change-msg.success{color:var(--sage-dark)}

/* ── PIN変更ボタン（ダッシュボード内） ── */
.pin-change-trigger{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--cream);border:1px solid var(--border);border-radius:10px;color:var(--brown);font-size:.8rem;font-weight:700;cursor:pointer;transition:all .3s;margin-top:12px}
.pin-change-trigger:hover{background:var(--cream-dark)}

/* ── Responsive ── */
@media (min-width: 768px) {
  .app { max-width: 720px; }
  .stats-grid { grid-template-columns: repeat(3, 1fr); }
  .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
}
@media (min-width: 1024px) {
  .app { max-width: 960px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-dots"><span></span><span></span><span></span></div>
    <div class="loading-text">読み込み中...</div>
  </div>
</div>

<script>
(function(){
  const app = document.getElementById('app');

  // ── XSS対策 ──
  function esc(s){ return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // ── URLからtoken取得 ──
  const params = new URLSearchParams(location.search);
  const token = params.get('token');

  if (!token) {
    showPinLogin();
    return;
  }

  // ── Step 1: トークン検証 ──
  fetch('/api/parent-verify?token=' + encodeURIComponent(token))
    .then(r => {
      if (!r.ok) throw new Error('invalid');
      return r.json();
    })
    .then(verifyData => {
      // ── Step 2: ダッシュボードデータ取得 ──
      return fetch('/api/parent-dashboard?token=' + encodeURIComponent(token))
        .then(r => {
          if (!r.ok) throw new Error('dashboard_error');
          return r.json();
        })
        .then(dashData => {
          renderDashboard(verifyData, dashData);
        });
    })
    .catch(err => {
      if (err.message === 'dashboard_error') {
        showAuth('error', 'データの取得に失敗しました', 'しばらくしてからもう一度お試しください。');
      } else {
        showAuth('expired', 'リンクが無効です', 'このリンクは無効または期限切れです。\n先生に新しいリンクを発行してもらってください。');
      }
    });

  // ── PINログイン画面 ──
  function showPinLogin() {
    app.innerHTML = `
      <div class="pin-login-screen">
        <div class="pin-login-box">
          <div class="pin-login-title">TRAIL おやこダッシュボード</div>
          <input class="pin-login-input" id="slugInput" placeholder="教室ID" autocomplete="off">
          <input class="pin-login-input" id="nameInput" placeholder="お子さまの名前" autocomplete="off">
          <input class="pin-login-input" id="pinInput" type="tel" maxlength="4" placeholder="0000" inputmode="numeric" autocomplete="off">
          <button class="pin-login-btn" id="pinLoginBtn">ログイン</button>
          <div class="pin-login-error" id="pinLoginError"></div>
        </div>
      </div>`;
    const slugEl = document.getElementById('slugInput');
    const nameEl = document.getElementById('nameInput');
    const pinEl = document.getElementById('pinInput');
    const btn = document.getElementById('pinLoginBtn');
    const errEl = document.getElementById('pinLoginError');
    btn.addEventListener('click', function() {
      const slug = slugEl.value.trim();
      const name = nameEl.value.trim();
      const pin = pinEl.value.trim();
      if (!slug || !name || !pin) { errEl.textContent = '全項目を入力してください'; return; }
      btn.disabled = true;
      errEl.textContent = '';
      fetch('/api/parent-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tenant_slug: slug, student_name: name, pin: pin })
      })
      .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
      .then(function(res) {
        if (!res.ok) { errEl.textContent = res.data.error || 'ログインに失敗しました'; btn.disabled = false; return; }
        location.href = location.pathname + '?token=' + encodeURIComponent(res.data.token);
      })
      .catch(function() { errEl.textContent = '通信エラーが発生しました'; btn.disabled = false; });
    });
  }

  // ── 認証/エラー画面 ──
  function showAuth(type, title, msg) {
    const icons = { link: '\uD83D\uDD17', expired: '\u23F3', error: '\u26A0\uFE0F' };
    app.innerHTML = `
      <div class="auth-screen">
        <div class="auth-icon">${icons[type] || '\uD83D\uDD12'}</div>
        <div class="auth-title">${esc(title)}</div>
        <div class="auth-msg">${esc(msg).replace(/\n/g,'<br>')}</div>
      </div>`;
  }

  // ── 日付フォーマット ──
  function fmtDate(str) {
    if (!str) return '';
    try {
      const d = new Date(str.includes('T') || str.includes('Z') ? str : str + 'T00:00:00');
      return (d.getMonth()+1) + '/' + d.getDate();
    } catch(e) { return str; }
  }

  function fmtMonth(str) {
    if (!str) return '';
    const parts = str.split('-');
    if (parts.length >= 2) return parseInt(parts[0]) + '年' + parseInt(parts[1]) + '月';
    return str;
  }

  // ── メインレンダリング ──
  function renderDashboard(verify, data) {
    const s = verify.student;
    const t = verify.tenant;
    const initial = s.name ? s.name.charAt(0) : '?';
    const totalDays = data.attendance ? data.attendance.total : 0;
    const rank = data.rank || {position:'-',total:0,label:'F',name:'見習い探究者'};

    let html = '';

    // ① ヘッダー
    html += `
      <div class="header">
        <div class="header-icon">T</div>
        <div class="header-text">
          <h1>TRAIL おやこダッシュボード</h1>
          <p>${esc(t.name)}</p>
        </div>
      </div>`;

    // 生徒カード
    html += `
      <div class="student-card">
        <div class="student-row">
          <div class="student-avatar">${esc(initial)}</div>
          <div class="student-info">
            <h2>${esc(s.name)}</h2>
            <div>
              <span class="class-badge">${esc(s.className)}</span>
              ${totalDays > 0 ? '<span class="days-badge">' + totalDays + '\u65E5\u53C2\u52A0</span>' : ''}
            </div>
            <div class="rank-badge"><span class="rank-letter">${esc(rank.label)}</span> ${esc(rank.name)}</div>
          </div>
        </div>
      </div>`;

    // ② 統計カード（タブ切り替え）
    html += `
      <div class="stats-tabs" id="statsTabs">
        <div class="stats-tab active" data-tab="today">\u4ECA\u65E5</div>
        <div class="stats-tab" data-tab="week">\u4ECA\u9031</div>
        <div class="stats-tab" data-tab="total">\u7D2F\u8A08</div>
      </div>
      <div class="stats-grid mb-16" id="statsGrid">
        ${renderStats(data.stats ? data.stats.today : {alt:0,plays:0,minutes:0})}
      </div>`;

    // ③ 今月のALTと出席
    const monthAlt = data.stats ? data.stats.total.alt : 0;
    const thisMonth = data.attendance ? data.attendance.thisMonth : 0;
    const lastMonth = data.attendance ? data.attendance.lastMonth : 0;

    html += `
      <div class="section-title"><span>\uD83C\uDFC6</span> \u4ECA\u6708\u306E\u6210\u7E3E</div>
      <div class="monthly-grid mb-10">
        <div class="monthly-card">
          <div class="mc-label">\u4ECA\u6708\u306EALT\u5408\u8A08</div>
          <div class="mc-value">${data.stats ? data.stats.total.alt : 0} <span style="font-size:.7rem;color:var(--text-dim)">ALT</span></div>
          <div class="mc-sub">\u5148\u6708\u306E\u51FA\u5E2D: ${lastMonth}\u65E5</div>
        </div>
        <div class="monthly-card">
          <div class="mc-label">\u4ECA\u6708\u306E\u51FA\u5E2D</div>
          <div class="mc-value">${thisMonth} <span style="font-size:.7rem;color:var(--text-dim)">\u65E5</span></div>
          <div class="mc-sub">\u7D2F\u8A08: ${totalDays}\u65E5</div>
        </div>
      </div>
      <div class="rank-card mb-16">
        <div class="rank-pos">${rank.position}\u4F4D <span style="font-size:.8rem;font-weight:500">/ ${rank.total}\u4EBA\u4E2D</span></div>
        <div class="rank-label">${esc(rank.label)}\u30E9\u30F3\u30AF\u300C${esc(rank.name)}\u300D</div>
      </div>`;

    // ④ 先生からのコメント
    html += `<div class="section-title"><span>\uD83D\uDCAC</span> \u5148\u751F\u304B\u3089\u306E\u30B3\u30E1\u30F3\u30C8</div>`;
    html += '<div class="card">';
    if (data.teacherComments && data.teacherComments.length > 0) {
      html += '<div class="accordion" id="teacherAccordion">';
      const grouped = groupByMonth(data.teacherComments, 'month');
      let first = true;
      for (const [month, items] of Object.entries(grouped)) {
        html += `
          <div class="accordion-item${first ? ' open' : ''}">
            <div class="accordion-header" onclick="this.parentElement.classList.toggle('open')">
              <span class="accordion-month">${fmtMonth(month)}</span>
              <span>
                <span class="accordion-badge">${items.length}\u4EF6</span>
                <span class="accordion-arrow">\u25BC</span>
              </span>
            </div>
            <div class="accordion-body">
              ${items.map(c => `<div class="accordion-content">${esc(c.comment)}</div>`).join('')}
            </div>
          </div>`;
        first = false;
      }
      html += '</div>';
    } else {
      html += '<div class="card-empty">\u307E\u3060\u30B3\u30E1\u30F3\u30C8\u306F\u3042\u308A\u307E\u305B\u3093</div>';
    }
    html += '</div>';

    // ⑤ AIからのコメント
    html += `<div class="section-title"><span>\uD83E\uDD16</span> AI\u304B\u3089\u306E\u30B3\u30E1\u30F3\u30C8</div>`;
    html += '<div class="card">';
    if (data.aiComments && data.aiComments.length > 0) {
      html += '<div class="accordion" id="aiAccordion">';
      const grouped = groupByMonth(data.aiComments, 'month');
      let first = true;
      for (const [month, items] of Object.entries(grouped)) {
        html += `
          <div class="accordion-item${first ? ' open' : ''}">
            <div class="accordion-header" onclick="this.parentElement.classList.toggle('open')">
              <span class="accordion-month">${fmtMonth(month)}</span>
              <span>
                <span class="accordion-badge ai">AI</span>
                <span class="accordion-arrow">\u25BC</span>
              </span>
            </div>
            <div class="accordion-body">
              ${items.map(c => `<div class="accordion-content">${esc(c.comment)}</div>`).join('')}
            </div>
          </div>`;
        first = false;
      }
      html += '</div>';
    } else {
      html += '<div class="card-empty">\u307E\u3060AI\u30B3\u30E1\u30F3\u30C8\u306F\u3042\u308A\u307E\u305B\u3093</div>';
    }
    html += '</div>';

    // ⑥ 学習カレンダー
    html += `<div class="section-title"><span>\uD83D\uDCC5</span> \u5B66\u7FD2\u30AB\u30EC\u30F3\u30C0\u30FC</div>`;
    html += '<div class="card">' + renderCalendar(data.calendar || []) + '</div>';

    // ⑦ カテゴリ別得意・苦手
    html += `<div class="section-title"><span>\uD83D\uDCCA</span> \u30AB\u30C6\u30B4\u30EA\u5225\u6210\u7E3E</div>`;
    html += '<div class="card">';
    if (data.categoryStats && data.categoryStats.length > 0) {
      const maxPlays = Math.max(...data.categoryStats.map(c => c.plays));
      let bestCat = '';
      let bestRate = -1;
      data.categoryStats.forEach(c => {
        const rate = c.total > 0 ? c.correct / c.total : 0;
        if (rate > bestRate) { bestRate = rate; bestCat = c.category; }
      });
      data.categoryStats.forEach(c => {
        const rate = c.total > 0 ? Math.round(c.correct / c.total * 100) : 0;
        const barW = c.total > 0 ? rate : 0;
        html += `
          <div class="category-item">
            <div class="category-name">${esc(c.category)}${c.category === bestCat ? '<span class="category-best">\u5F97\u610F\uFF01</span>' : ''}</div>
            <div class="category-bar-wrap"><div class="category-bar" style="width:${barW}%"></div></div>
            <div class="category-pct">${rate}%</div>
          </div>`;
      });
    } else {
      html += '<div class="card-empty">\u307E\u3060\u30C7\u30FC\u30BF\u304C\u3042\u308A\u307E\u305B\u3093</div>';
    }
    html += '</div>';

    // ⑧ ランキング推移
    html += `<div class="section-title"><span>\uD83D\uDCC8</span> \u30E9\u30F3\u30AD\u30F3\u30B0\u63A8\u79FB</div>`;
    html += '<div class="card">';
    if (data.rankHistory && data.rankHistory.length > 1) {
      html += renderRankGraph(data.rankHistory, rank.total);
    } else {
      html += '<div class="card-empty">\u307E\u3060\u5341\u5206\u306A\u30C7\u30FC\u30BF\u304C\u3042\u308A\u307E\u305B\u3093</div>';
    }
    html += '</div>';

    // ⑨ ゲーム別ベストスコア
    html += `<div class="section-title"><span>\u2B50</span> \u30D9\u30B9\u30C8\u30B9\u30B3\u30A2</div>`;
    html += '<div class="card">';
    if (data.bestScores && data.bestScores.length > 0) {
      html += '<div class="score-cards">';
      data.bestScores.forEach(s => {
        html += `
          <div class="score-card">
            <div class="score-emoji">${esc(s.game_emoji || '\uD83C\uDFAE')}</div>
            <div class="score-name">${esc(s.game_name)}</div>
            <div class="score-value">${s.score}</div>
            <div class="score-label">${esc(s.score_label || '\u70B9')}</div>
          </div>`;
      });
      html += '</div>';
    } else {
      html += '<div class="card-empty">\u307E\u3060\u30B9\u30B3\u30A2\u304C\u3042\u308A\u307E\u305B\u3093</div>';
    }
    html += '</div>';

    // ⑩ 次の目標
    html += `<div class="section-title"><span>\uD83C\uDFAF</span> \u6B21\u306E\u76EE\u6A19</div>`;
    if (data.nextGoal) {
      html += `
        <div class="goal-card">
          <div class="goal-icon">\uD83C\uDFAF</div>
          <div class="goal-text">${esc(data.nextGoal)}</div>
        </div>`;
    } else {
      html += `
        <div class="goal-card">
          <div class="goal-icon">\uD83C\uDF31</div>
          <div class="goal-empty">\u307E\u3060\u8A2D\u5B9A\u3055\u308C\u3066\u3044\u307E\u305B\u3093</div>
        </div>`;
    }

    // ⑩b PIN変更ボタン
    html += '<div style="text-align:center"><button class="pin-change-trigger" id="pinChangeBtn">\uD83D\uDD10 PIN変更</button></div>';

    // ⑪ 最近のゲーム履歴
    html += `<div class="section-title"><span>\uD83C\uDFAE</span> \u6700\u8FD1\u306E\u30B2\u30FC\u30E0\u5C65\u6B74</div>`;
    html += '<div class="card">';
    if (data.recentPlays && data.recentPlays.length > 0) {
      data.recentPlays.forEach(p => {
        html += `
          <div class="play-item">
            <div class="play-emoji">${esc(p.game_emoji || '\uD83C\uDFAE')}</div>
            <div class="play-body">
              <div class="play-name">${esc(p.game_name)}</div>
              <div class="play-date">${fmtDate(p.date)}</div>
            </div>
            ${p.alt > 0 ? '<div class="play-alt">+' + p.alt + ' ALT</div>' : ''}
          </div>`;
      });
    } else {
      html += '<div class="card-empty">\u307E\u3060\u30D7\u30EC\u30A4\u8A18\u9332\u304C\u3042\u308A\u307E\u305B\u3093</div>';
    }
    html += '</div>';

    app.innerHTML = html;

    // ── タブ切り替え ──
    const tabs = document.querySelectorAll('.stats-tab');
    const grid = document.getElementById('statsGrid');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const key = tab.dataset.tab;
        const s = data.stats ? data.stats[key] : {alt:0,plays:0,minutes:0};
        grid.innerHTML = renderStats(s || {alt:0,plays:0,minutes:0});
      });
    });

    // ── PIN変更ボタン ──
    const pinChangeBtn = document.getElementById('pinChangeBtn');
    if (pinChangeBtn) {
      pinChangeBtn.addEventListener('click', function() { showPinChangeModal(); });
    }
  }

  // ── PIN変更モーダル ──
  function showPinChangeModal() {
    const overlay = document.createElement('div');
    overlay.className = 'pin-change-overlay';
    overlay.innerHTML = `
      <div class="pin-change-box">
        <div class="pin-change-title">\uD83D\uDD10 PIN変更</div>
        <input class="pin-change-input" id="currentPinInput" type="tel" maxlength="4" placeholder="現在のPIN" inputmode="numeric">
        <input class="pin-change-input" id="newPinInput" type="tel" maxlength="4" placeholder="新しいPIN（4桁）" inputmode="numeric">
        <input class="pin-change-input" id="confirmPinInput" type="tel" maxlength="4" placeholder="新しいPIN（確認）" inputmode="numeric">
        <button class="pin-change-btn" id="changePinBtn">変更する</button>
        <button class="pin-change-cancel" id="cancelPinBtn">キャンセル</button>
        <div class="pin-change-msg" id="pinChangeMsg"></div>
      </div>`;
    document.body.appendChild(overlay);

    overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
    document.getElementById('cancelPinBtn').addEventListener('click', function() { overlay.remove(); });
    document.getElementById('changePinBtn').addEventListener('click', function() {
      var currentPin = document.getElementById('currentPinInput').value.trim();
      var newPin = document.getElementById('newPinInput').value.trim();
      var confirmPin = document.getElementById('confirmPinInput').value.trim();
      var msgEl = document.getElementById('pinChangeMsg');
      msgEl.className = 'pin-change-msg';
      msgEl.textContent = '';
      if (!currentPin || !newPin || !confirmPin) { msgEl.className = 'pin-change-msg error'; msgEl.textContent = '全項目を入力してください'; return; }
      if (!/^\d{4}$/.test(newPin)) { msgEl.className = 'pin-change-msg error'; msgEl.textContent = 'PINは4桁の数字です'; return; }
      if (newPin !== confirmPin) { msgEl.className = 'pin-change-msg error'; msgEl.textContent = '新しいPINが一致しません'; return; }
      var btn = document.getElementById('changePinBtn');
      btn.disabled = true;
      fetch('/api/parent-change-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ current_pin: currentPin, new_pin: newPin })
      })
      .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
      .then(function(res) {
        if (!res.ok) { msgEl.className = 'pin-change-msg error'; msgEl.textContent = res.data.error || 'エラーが発生しました'; btn.disabled = false; return; }
        msgEl.className = 'pin-change-msg success'; msgEl.textContent = 'PIN変更しました';
        setTimeout(function() { overlay.remove(); }, 1500);
      })
      .catch(function() { msgEl.className = 'pin-change-msg error'; msgEl.textContent = '通信エラーが発生しました'; btn.disabled = false; });
    });
  }

  // ── 統計カードHTML ──
  function renderStats(s) {
    return `
      <div class="stat-card">
        <div class="stat-value gold">${s.alt || 0}</div>
        <div class="stat-label">ALT\u7372\u5F97</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${s.plays || 0}</div>
        <div class="stat-label">\u30D7\u30EC\u30A4\u6570</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${s.minutes || 0}</div>
        <div class="stat-label">\u5B66\u7FD2\u6642\u9593(\u5206)</div>
      </div>`;
  }

  // ── 月別グループ化 ──
  function groupByMonth(items, monthKey) {
    const groups = {};
    items.forEach(item => {
      const m = item[monthKey] || 'unknown';
      // monthが日付形式(YYYY-MM-DD)の場合、YYYY-MMに変換
      const key = m.length > 7 ? m.substring(0, 7) : m;
      if (!groups[key]) groups[key] = [];
      groups[key].push(item);
    });
    return groups;
  }

  // ── カレンダー描画 ──
  function renderCalendar(calData) {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = now.getDate();

    // 活動データをマップに変換
    const actMap = {};
    let maxAlt = 1;
    calData.forEach(d => {
      const day = parseInt(d.date.split('-')[2]);
      actMap[day] = d;
      if (d.alt > maxAlt) maxAlt = d.alt;
    });

    const dayNames = ['\u65E5','\u6708','\u706B','\u6C34','\u6728','\u91D1','\u571F'];
    let html = '<div class="calendar-grid">';
    html += '<div class="calendar-header">' + dayNames.map(d => '<span>' + d + '</span>').join('') + '</div>';
    html += '<div class="calendar-days">';

    // 空白埋め
    for (let i = 0; i < firstDay; i++) {
      html += '<div class="calendar-day empty"></div>';
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const act = actMap[d];
      let cls = 'calendar-day';
      if (d === today) cls += ' today';
      if (act) {
        const ratio = act.alt / maxAlt;
        if (ratio >= 0.7) cls += ' activity-max';
        else if (ratio >= 0.4) cls += ' activity-high';
        else cls += ' has-activity';
      }
      html += `<div class="${cls}">${d}</div>`;
    }

    html += '</div></div>';
    return html;
  }

  // ── ランキング推移グラフ ──
  function renderRankGraph(history, totalStudents) {
    const maxRank = totalStudents || Math.max(...history.map(h => h.position));
    const barHeight = 100; // max px

    let html = '<div class="rank-graph"><div class="rank-graph-inner">';
    history.forEach(h => {
      // 1位が最も高い棒にする（逆転）
      const heightPct = maxRank > 0 ? ((maxRank - h.position + 1) / maxRank) * barHeight : 20;
      const monthLabel = h.month ? parseInt(h.month.split('-')[1]) + '\u6708' : '';
      html += `
        <div class="rank-bar-wrap">
          <div class="rank-bar" style="height:${Math.max(heightPct, 10)}px">
            <div class="rank-bar-value">${h.position}\u4F4D</div>
          </div>
          <div class="rank-bar-month">${monthLabel}</div>
        </div>`;
    });
    html += '</div></div>';
    return html;
  }

})();
</script>
</body>
</html>
