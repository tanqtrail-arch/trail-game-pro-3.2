<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スーパー管理者 - TRAIL Game Pro</title>
<style>
  body { font-family: sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
  h1 { color: #00d4ff; }
  .login-box { background: #16213e; padding: 20px; border-radius: 10px; max-width: 400px; margin: 50px auto; }
  input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #0f3460; color: #fff; box-sizing: border-box; }
  button { background: #00d4ff; color: #000; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  button:hover { background: #00b8d9; }
  .danger { background: #e74c3c; color: #fff; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { padding: 10px; border: 1px solid #444; text-align: left; }
  th { background: #0f3460; }
  tr:hover { background: #16213e; }
  .section { background: #16213e; padding: 20px; border-radius: 10px; margin-top: 20px; }
</style>
</head>
<body>

<div id="loginArea">
  <div class="login-box">
    <h2>🔐 スーパー管理者ログイン</h2>
    <input type="email" id="email" placeholder="メールアドレス">
    <input type="password" id="password" placeholder="パスワード">
    <button onclick="login()">ログイン</button>
    <p id="loginError" style="color:red;"></p>
  </div>
</div>

<div id="mainArea" style="display:none;">
  <h1>🏫 TRAIL スーパー管理者</h1>
<div class="section">
    <h2>🎮 全教室に一括ゲーム登録</h2>
    <input type="text" id="gameEmoji" placeholder="絵文字（例：🎯）" style="width:80px;">
    <input type="text" id="gameName" placeholder="ゲーム名">
    <input type="text" id="gameUrl" placeholder="URL（任意）">
    <input type="text" id="gameCategory" placeholder="カテゴリ（例：算数）">
    <button onclick="broadcastGame()">📢 全教室に登録</button>
  </div>
  <div class="section">
    <h2>➕ 新しい教室を作成</h2>
    <input type="text" id="newName" placeholder="教室名">
    <input type="text" id="newSlug" placeholder="スラッグ（URL用）">
    <input type="email" id="newEmail" placeholder="管理者メール">
    <input type="password" id="newPass" placeholder="管理者パスワード">
    <select id="newPlan" style="width:100%;padding:10px;margin:8px 0;border-radius:6px;border:1px solid #444;background:#0f3460;color:#fff;">
      <option value="free">Free</option>
      <option value="pro">Pro</option>
はい    </select>
    <button onclick="createTenant()">作成</button>
  </div>

  <div class="section">
    <h2>📋 教室一覧</h2>
    <button onclick="loadTenants()">🔄 更新</button>
    <table id="tenantTable">
      <thead><tr><th>教室名</th><th>スラッグ</th><th>プラン</th><th>生徒数</th><th>管理者メール</th><th>操作</th></tr></thead>
      <tbody id="tenantBody"></tbody>
    </table>
  </div>
</div>

<script>
let authHeader = '';

function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  authHeader = btoa(email + ':' + password);
  fetch('/api/super/tenants', { headers: { 'x-super-admin': authHeader } })
    .then(r => {
      if (r.ok) {
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('mainArea').style.display = 'block';
        loadTenants();
      } else {
        document.getElementById('loginError').textContent = '認証失敗。メールとパスワードを確認してください。';
      }
    });
}

function loadTenants() {
  fetch('/api/super/tenants', { headers: { 'x-super-admin': authHeader } })
    .then(r => r.json())
    .then(tenants => {
      const tbody = document.getElementById('tenantBody');
      tbody.innerHTML = '';
      tenants.forEach(t => {
        tbody.innerHTML += `
          <tr>
            <td><input value="${t.name}" id="name_${t.id}" style="width:120px;padding:4px;background:#0f3460;color:#fff;border:1px solid #444;border-radius:4px;"></td>
            <td><input value="${t.slug}" id="slug_${t.id}" style="width:100px;padding:4px;background:#0f3460;color:#fff;border:1px solid #444;border-radius:4px;"></td>
            <td>
              <select id="plan_${t.id}" style="background:#0f3460;color:#fff;border:1px solid #444;border-radius:4px;padding:4px;">
                <option value="free" ${t.plan==='free'?'selected':''}>Free</option>
                <option value="pro" ${t.plan==='pro'?'selected':''}>Pro</option>
              </select>
            </td>
            <td>${t.student_count}</td>
            <td>${t.admin_email || '-'}</td>
            <td>
              <button onclick="updateTenant('${t.id}')">保存</button>
              <button class="danger" onclick="deleteTenant('${t.id}', '${t.name}')">削除</button>
            </td>
          </tr>`;
      });
    });
}

function updateTenant(id) {
  const name = document.getElementById('name_' + id).value;
  const slug = document.getElementById('slug_' + id).value;
  const plan = document.getElementById('plan_' + id).value;
  fetch('/api/super/tenants/' + id, {
    method: 'PATCH',
    headers: { 'x-super-admin': authHeader, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, slug, plan })
  }).then(() => { alert('更新しました！'); loadTenants(); });
}

function deleteTenant(id, name) {
  if (!confirm(`「${name}」を削除しますか？この操作は取り消せません。`)) return;
  fetch('/api/super/tenants/' + id, {
    method: 'DELETE',
    headers: { 'x-super-admin': authHeader }
  }).then(() => { alert('削除しました'); loadTenants(); });
}

function createTenant() {
  const name = document.getElementById('newName').value;
  const slug = document.getElementById('newSlug').value;
  const adminEmail = document.getElementById('newEmail').value;
  const adminPassword = document.getElementById('newPass').value;
  const plan = document.getElementById('newPlan').value;
  fetch('/api/super/tenants', {
    method: 'POST',
    headers: { 'x-super-admin': authHeader, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, slug, adminEmail, adminPassword, plan })
  }).then(() => { alert('作成しました！'); loadTenants(); });
}
function broadcastGame() {
  const emoji = document.getElementById('gameEmoji').value;
  const name = document.getElementById('gameName').value;
  const url = document.getElementById('gameUrl').value;
  const category = document.getElementById('gameCategory').value;
  if (!emoji || !name) { alert('絵文字とゲーム名は必須です'); return; }
  fetch('/api/super/games/broadcast', {
    method: 'POST',
    headers: { 'x-super-admin': authHeader, 'Content-Type': 'application/json' },
    body: JSON.stringify({ emoji, name, url, category })
  }).then(r => r.json()).then(d => {
    alert(`✅ ${d.count}教室に登録しました！`);
    document.getElementById('gameEmoji').value = '';
    document.getElementById('gameName').value = '';
    document.getElementById('gameUrl').value = '';
  document.getElementById('gameCategory').value = '';
  });
}
</script>
</body>
</html>
