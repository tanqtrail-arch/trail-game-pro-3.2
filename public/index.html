<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TRAIL GAME PRO 3 SaaS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-light:#f0f2f5;--bg-card:#ffffff;--text-primary:#2d3748;--text-dim:#a0aec0;--accent-cyan:#0090d9;--accent-gold:#e8a020;--accent-green:#2cb562;--accent-purple:#7c5cbf;--accent-pink:#e05070;--accent-orange:#ff9800;--border-glow:rgba(0,229,255,0.15)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-light);color:var(--text-primary);min-height:100vh;overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;background:linear-gradient(135deg,#667eea11,#764ba211)}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.8;transform:scale(1.5)}}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:12px;min-height:100vh}
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;padding:20px}
.login-logo{font-family:'Orbitron',sans-serif;font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,var(--accent-cyan),var(--accent-purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:6px}
.login-subtitle{font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:6px;color:var(--text-dim);text-align:center;margin-bottom:30px}
.login-box{width:100%;max-width:360px;background:var(--bg-card);border-radius:16px;padding:24px;border:1.5px solid rgba(0,0,0,0.06);box-shadow:0 4px 20px rgba(0,0,0,0.04)}
.login-box h2{font-family:'Orbitron',sans-serif;font-size:.9rem;text-align:center;margin-bottom:16px;letter-spacing:2px;color:var(--accent-cyan)}
.login-input{width:100%;padding:12px 14px;background:rgba(0,0,0,0.02);border:1.5px solid rgba(0,0,0,0.1);border-radius:10px;color:var(--text-primary);font-family:inherit;font-size:1rem;outline:none;margin-bottom:10px;transition:border-color .3s}
.login-input:focus{border-color:var(--accent-cyan);box-shadow:0 0 0 3px rgba(0,144,217,0.08)}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent-cyan),var(--accent-purple));border:none;border-radius:10px;color:#fff;font-family:'Orbitron',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;letter-spacing:2px;transition:all .3s;margin-top:6px}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,144,217,0.25)}
.admin-link{margin-top:16px;color:var(--text-dim);font-size:.75rem;cursor:pointer;transition:color .3s}
.admin-link:hover{color:var(--accent-cyan)}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 0;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.header-logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1rem;background:linear-gradient(135deg,var(--accent-cyan),var(--accent-purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.coin-display{font-family:'Orbitron',sans-serif;font-weight:700;color:var(--accent-gold);font-size:.85rem}
.badge-count{font-family:'Orbitron',sans-serif;font-weight:700;color:var(--accent-orange);font-size:.75rem}
.user-badge{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700}
.user-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent-cyan),var(--accent-purple));display:flex;align-items:center;justify-content:center;color:#fff;font-size:.7rem;font-weight:900}
.logout-btn{padding:6px 12px;border:1.5px solid rgba(224,80,112,0.25);background:none;color:var(--accent-pink);border-radius:8px;font-size:.7rem;cursor:pointer;transition:all .3s;font-family:inherit}
.logout-btn:hover{background:rgba(224,80,112,0.06)}
.section-title{font-family:'Orbitron',sans-serif;font-size:.7rem;letter-spacing:2px;color:var(--text-dim);margin-bottom:12px;margin-top:20px}
.category-filter{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.cat-btn{padding:6px 14px;border-radius:30px;border:1.5px solid rgba(0,0,0,0.08);background:var(--bg-card);color:var(--text-dim);font-family:inherit;font-size:.8rem;cursor:pointer;transition:all .3s;white-space:nowrap}
.cat-btn:hover{border-color:var(--accent-purple);color:var(--text-primary)}
.cat-btn.active{background:linear-gradient(135deg,rgba(124,92,191,0.12),rgba(0,144,217,0.08));border-color:var(--accent-purple);color:var(--accent-purple);font-weight:700}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.game-card{display:flex;flex-direction:column;align-items:center;padding:16px 10px;background:var(--bg-card);border:1.5px solid rgba(0,0,0,0.06);border-radius:14px;cursor:pointer;transition:all .3s;text-decoration:none;color:inherit;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.03)}
.game-card:hover{transform:translateY(-3px);border-color:var(--border-glow);box-shadow:0 8px 25px rgba(0,0,0,0.06)}
.game-emoji{font-size:2rem;margin-bottom:6px;position:relative;z-index:1}
.game-name{font-weight:700;font-size:.85rem;text-align:center;position:relative;z-index:1}
.game-category-badge{display:inline-block;font-size:.6rem;padding:2px 10px;border-radius:20px;background:linear-gradient(135deg,rgba(0,144,217,0.08),rgba(124,92,191,0.08));color:var(--accent-purple);margin-bottom:6px;border:1px solid rgba(124,92,191,0.15);position:relative;z-index:1}
.game-coins{font-family:'Orbitron',sans-serif;font-size:.75rem;color:var(--accent-gold);position:relative;z-index:1}
.game-link-hint{font-size:.65rem;color:var(--text-dim);margin-top:8px;position:relative;z-index:1;transition:color .3s}
.game-card:hover .game-link-hint{color:var(--accent-cyan)}
.ranking-section{margin-bottom:30px}
.ranking-list{display:flex;flex-direction:column;gap:8px}
.rank-item{display:flex;align-items:center;gap:12px;background:var(--bg-card);border:1.5px solid rgba(0,0,0,0.06);border-radius:12px;padding:12px 16px;transition:all .3s;box-shadow:0 1px 4px rgba(0,0,0,0.03)}
.rank-item.rank-gold{border:2px solid #d4a020;background:linear-gradient(135deg,#fffbe6,#fff3cc);box-shadow:0 2px 12px rgba(212,160,32,0.12)}
.rank-item.rank-silver{border:2px solid #b0b0b8;background:linear-gradient(135deg,#f5f6f8,#ebedf2)}
.rank-item.rank-bronze{border:2px solid #c07830;background:linear-gradient(135deg,#fef4e8,#fcebd8)}
.rank-medal{font-size:1.8rem;width:40px;text-align:center;flex-shrink:0;line-height:1;filter:drop-shadow(0 0 4px rgba(255,215,0,0.4))}
.rank-num{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1rem;width:40px;text-align:center;flex-shrink:0;color:var(--text-dim)}
.rank-name{flex:1;font-weight:700;font-size:.95rem;color:var(--text-primary)}
.rank-alt{font-family:'Orbitron',sans-serif;font-weight:700;color:var(--accent-gold);font-size:.8rem;flex-shrink:0;margin-left:auto}
.rank-badges{display:flex;gap:3px;margin-right:8px}
.rank-badge-dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--accent-orange),#ff6d00);box-shadow:0 0 6px rgba(255,152,0,0.3);font-size:.5rem;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
.tbl-wrap{width:100%;background:var(--bg-card);border-radius:12px;overflow-x:auto;border:1.5px solid rgba(0,0,0,0.06);-webkit-overflow-scrolling:touch;box-shadow:0 1px 4px rgba(0,0,0,0.03)}
.tbl-wrap table{width:100%;border-collapse:collapse;min-width:300px}
.tbl-wrap th{background:rgba(0,144,217,0.06);padding:10px 12px;text-align:left;font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--accent-cyan);letter-spacing:1px;white-space:nowrap}
.tbl-wrap td{padding:10px 12px;border-top:1px solid rgba(0,0,0,0.04);font-size:.85rem}
.tbl-wrap tr:hover td{background:rgba(0,144,217,0.02)}
.coin-plus{color:var(--accent-gold);font-family:'Orbitron',sans-serif;font-weight:700}
.no-data{text-align:center;color:var(--text-dim);padding:30px;font-size:.85rem}
.admin-tabs{display:flex;gap:3px;margin-bottom:20px;background:var(--bg-card);border-radius:12px;padding:3px;border:1.5px solid rgba(0,0,0,0.06);overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:0 1px 4px rgba(0,0,0,0.03)}
.admin-tab{flex:1;padding:10px 6px;background:none;border:none;color:var(--text-dim);font-family:'Orbitron',sans-serif;font-size:.55rem;letter-spacing:.5px;cursor:pointer;border-radius:10px;transition:all .3s;white-space:nowrap;min-width:0}
.admin-tab.active{background:rgba(0,144,217,0.1);color:var(--accent-cyan)}
.admin-tab:hover:not(.active){color:var(--text-primary)}
.admin-form,.game-manage-form,.cat-manage-form,.badge-manage-form{background:var(--bg-card);border:1.5px solid rgba(0,0,0,0.06);border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,0.03)}
.admin-form h3,.game-manage-form h3,.cat-manage-form h3,.badge-manage-form h3{font-family:'Orbitron',sans-serif;font-size:.75rem;margin-bottom:16px;letter-spacing:2px}
.admin-form h3{color:var(--accent-gold)}
.game-manage-form h3{color:var(--accent-green)}
.cat-manage-form h3{color:var(--accent-purple)}
.badge-manage-form h3{color:var(--accent-orange)}
.form-stack{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:.7rem;color:var(--text-dim);letter-spacing:.5px}
.form-group select,.form-group input{padding:10px 12px;background:rgba(0,0,0,0.02);border:1.5px solid rgba(0,0,0,0.1);border-radius:8px;color:var(--text-primary);font-family:inherit;font-size:.9rem;outline:none;transition:border-color .3s;width:100%}
.form-group select:focus,.form-group input:focus{border-color:var(--accent-cyan);box-shadow:0 0 0 3px rgba(0,144,217,0.08)}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn-primary{width:100%;padding:12px;border:none;border-radius:10px;font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:700;cursor:pointer;transition:all .3s;letter-spacing:1px;color:#fff}
.btn-primary:hover{transform:translateY(-2px)}
.btn-gold{background:linear-gradient(135deg,var(--accent-gold),#ff9800)}
.btn-green{background:linear-gradient(135deg,var(--accent-green),#00c853)}
.btn-purple{background:linear-gradient(135deg,var(--accent-purple),var(--accent-cyan))}
.btn-orange{background:linear-gradient(135deg,var(--accent-orange),#ff6d00)}
.game-list-admin{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.game-list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(0,0,0,0.015);border-radius:10px;border:1px solid rgba(0,0,0,0.05);gap:10px}
.game-list-item-info{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.game-list-item-info>span:first-child{font-size:1.3rem;flex-shrink:0}
.game-list-item-info div{min-width:0}
.game-list-item-info strong{display:block;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-item-cat{font-size:.6rem;padding:2px 6px;border-radius:12px;background:rgba(179,136,255,0.1);color:var(--accent-purple);margin-left:6px}
.delete-btn{background:none;border:1.5px solid rgba(224,80,112,0.2);color:var(--accent-pink);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.7rem;transition:all .3s;flex-shrink:0;font-family:inherit}
.delete-btn:hover{background:rgba(224,80,112,0.06)}
.cat-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cat-tag{display:flex;align-items:center;gap:4px;padding:5px 12px;background:rgba(179,136,255,0.1);border:1px solid rgba(179,136,255,0.25);border-radius:20px;color:var(--accent-purple);font-size:.8rem}
.cat-tag .cat-del{background:none;border:none;color:var(--accent-pink);cursor:pointer;font-size:.75rem;padding:0 2px;opacity:.6;transition:opacity .3s}
.cat-tag .cat-del:hover{opacity:1}
.summary-th{background:rgba(179,136,255,0.08)!important}
.summary-th th{color:var(--accent-purple)!important}
.total-coins{font-family:'Orbitron',sans-serif;font-weight:700;color:var(--accent-gold)}
.game-rank-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.game-rank-tab{padding:6px 14px;border-radius:30px;border:1.5px solid rgba(0,0,0,0.08);background:var(--bg-card);color:var(--text-dim);font-family:inherit;font-size:.8rem;cursor:pointer;transition:all .3s;white-space:nowrap}
.game-rank-tab.active{background:linear-gradient(135deg,rgba(232,160,32,0.12),rgba(232,120,48,0.1));border-color:var(--accent-gold);color:var(--accent-gold);font-weight:700}
.game-rank-table .rank-score{font-family:'Orbitron',sans-serif;font-weight:700;color:var(--accent-cyan);font-size:.85rem}
.game-rank-table .score-label{font-size:.65rem;color:var(--text-dim);margin-left:2px}
.portal-tabs{display:flex;gap:3px;margin-bottom:20px;background:var(--bg-card);border-radius:12px;padding:3px;border:1.5px solid rgba(0,0,0,0.06);overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:0 1px 4px rgba(0,0,0,0.03)}
.portal-tab{flex:1;padding:10px 6px;background:none;border:none;color:var(--text-dim);font-family:'Orbitron',sans-serif;font-size:.55rem;letter-spacing:.5px;cursor:pointer;border-radius:10px;transition:all .3s;white-space:nowrap;min-width:0}
.portal-tab.active{background:rgba(0,144,217,0.1);color:var(--accent-cyan)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--accent-green);color:#fff;padding:10px 24px;border-radius:30px;font-weight:700;font-size:.85rem;z-index:999;transition:transform .4s ease;box-shadow:0 4px 20px rgba(44,181,98,0.25);white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.class-select-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.class-select-btn{padding:14px 12px;background:rgba(0,0,0,0.02);border:1.5px solid rgba(0,0,0,0.08);border-radius:12px;color:var(--text-primary);font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .25s;text-align:center}
.class-select-btn:hover{border-color:var(--accent-cyan);background:rgba(0,144,217,0.05)}
.class-select-btn.active{border-color:var(--accent-cyan);background:rgba(0,144,217,0.1);color:var(--accent-cyan);box-shadow:0 0 0 3px rgba(0,144,217,0.1)}
.activity-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg-card);border:1.5px solid rgba(0,0,0,0.06);border-radius:14px;padding:16px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,0.03)}
.stat-card .stat-value{font-family:'Orbitron',sans-serif;font-size:1.4rem;font-weight:900;margin-bottom:4px}
.stat-card .stat-label{font-size:.7rem;color:var(--text-dim)}
.stat-gold .stat-value{color:var(--accent-gold)}
.stat-cyan .stat-value{color:var(--accent-cyan)}
.stat-purple .stat-value{color:var(--accent-purple)}
.stat-green .stat-value{color:var(--accent-green)}
.stat-orange .stat-value{color:var(--accent-orange)}
.online-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.online-chip{display:flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(44,181,98,0.08);border:1.5px solid rgba(44,181,98,0.25);border-radius:30px;font-size:.8rem;color:var(--accent-green)}
.online-chip .online-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-green);animation:pulse-dot 1.5s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
.duration-badge{font-family:'Orbitron',sans-serif;font-size:.75rem;color:var(--accent-purple)}
.activity-feed{display:flex;flex-direction:column;gap:8px;max-height:500px;overflow-y:auto}
.activity-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;background:var(--bg-card);border:1.5px solid rgba(0,0,0,0.06);border-radius:12px;transition:all .3s;box-shadow:0 1px 4px rgba(0,0,0,0.03)}
.activity-icon{font-size:1.3rem;flex-shrink:0;width:32px;text-align:center}
.activity-body{flex:1;min-width:0}
.activity-body strong{font-size:.85rem;color:var(--text-primary)}
.activity-body p{font-size:.75rem;color:var(--text-dim);margin-top:2px}
.activity-time{font-size:.65rem;color:var(--text-dim);flex-shrink:0;white-space:nowrap;font-family:'Orbitron',sans-serif}
.usage-bar-row{display:flex;align-items:center;gap:8px;font-size:.8rem}
.usage-bar-label{min-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.usage-bar-track{flex:1;height:18px;background:rgba(0,0,0,0.04);border-radius:9px;overflow:hidden;position:relative}
.usage-bar-fill{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent-cyan),var(--accent-purple));transition:width .3s}
.usage-bar-val{font-family:'Orbitron',sans-serif;font-size:.65rem;color:var(--text-dim);min-width:50px;text-align:right;flex-shrink:0}
.alert-card{background:rgba(224,80,112,0.05);border:1.5px solid rgba(224,80,112,0.2);border-radius:12px;padding:12px 16px;margin-bottom:12px;font-size:.8rem;color:var(--accent-pink)}
.lockout-msg{background:rgba(224,80,112,0.08);border:1.5px solid rgba(224,80,112,0.25);border-radius:10px;padding:12px 16px;color:var(--accent-pink);font-size:.8rem;margin-top:12px;text-align:center}

/* ===== 0-15 追加CSS ===== */
/* ─── ストリークウィジェット ─── */
.streak-widget{display:flex;align-items:center;gap:10px;background:rgba(255,149,0,0.07);border:1.5px solid rgba(255,149,0,0.2);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.streak-widget .sw-flame{font-size:1.8rem;animation:sw-flicker 1.5s infinite alternate}
@keyframes sw-flicker{from{transform:scale(1) rotate(-2deg)}to{transform:scale(1.06) rotate(2deg)}}
.streak-widget .sw-info{flex:1}
.streak-widget .sw-current{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.2rem;color:#ff9500;line-height:1}
.streak-widget .sw-label{font-size:.65rem;color:var(--text-dim);margin-top:2px}
.streak-widget .sw-dots{display:flex;gap:4px;align-items:center}
.streak-widget .sw-dot{width:20px;height:20px;border-radius:50%;background:rgba(255,149,0,0.12);border:1.5px solid rgba(255,149,0,0.2);display:flex;align-items:center;justify-content:center;font-size:.65rem}
.streak-widget .sw-dot.played{background:rgba(255,149,0,0.25);border-color:rgba(255,149,0,0.6)}
/* ─── ALT獲得ポップアップ ─── */
#alt-popup{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-160px);z-index:10000;transition:transform .45s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none}
#alt-popup.show{transform:translateX(-50%) translateY(16px)}
.alt-popup-inner{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1.5px solid rgba(255,149,0,0.5);border-radius:20px;padding:16px 28px;text-align:center;box-shadow:0 8px 32px rgba(255,149,0,0.3);min-width:200px}
.alt-popup-label{font-size:.65rem;color:rgba(255,149,0,0.6);letter-spacing:2px;font-family:'Orbitron',sans-serif;margin-bottom:4px}
.alt-popup-total{font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:900;color:#ff9500;text-shadow:0 0 16px rgba(255,149,0,0.5)}
.alt-popup-awards{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.alt-popup-award{display:flex;justify-content:space-between;font-size:.72rem;gap:16px}
.alt-popup-award-lbl{color:rgba(255,255,255,0.55)}
.alt-popup-award-amt{color:#ff9500;font-weight:700}

/* ─── 生徒ダッシュボード ─── */
.dash-section{background:var(--bg-card);border:1.5px solid rgba(0,0,0,0.06);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,0.03)}

<body>
<div class="stars" id="stars"></div>
<div class="toast" id="toast"></div>
<!-- ★ 0-15: ALT獲得ポップアップ -->
<div id="alt-popup">
  <div class="alt-popup-inner">
    <div class="alt-popup-label">ALT 獲得！</div>
    <div class="alt-popup-total" id="alt-popup-total">+0 ALT</div>
    <div class="alt-popup-awards" id="alt-popup-awards"></div>
  </div>
</div>
<div class="app" id="app"></div>
<script>
const CATEGORIES=['算数','地理','歴史','理科','国語','その他'];
const CAT_EMOJI={'算数':'🔢','地理':'🗾','歴史':'🏯','理科':'🔬','国語':'📖','その他':'🎮'};
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
// 🆕 ゲームURLにトークン・認証パラメータを付与するヘルパー
function buildGameUrl(baseUrl){
  if(!baseUrl)return'';
  const p=new URLSearchParams();
  if(S.token)p.set('token',S.token);
  if(S.user){
    if(S.user.id)p.set('student_id',S.user.id);
    if(S.user.name)p.set('player',S.user.name);
    if(S.user.className)p.set('class_name',S.user.className);
  }
  if(S.tenant){
    if(S.tenant.slug)p.set('tenant_slug',S.tenant.slug);
    if(S.tenant.id)p.set('tenant_id',S.tenant.id);
  }
  // ゲーム側が「HOMEに戻る」で使うreturn_url
  const retP=new URLSearchParams();
  if(S.token)retP.set('token',S.token);
  if(S.user&&S.user.id)retP.set('student_id',S.user.id);
  if(S.user&&S.user.name)retP.set('student_name',S.user.name);
  if(S.user&&S.user.className)retP.set('class_name',S.user.className);
  if(S.tenant&&S.tenant.slug)retP.set('tenant_slug',S.tenant.slug);
  if(S.tenant&&S.tenant.id)retP.set('tenant_id',S.tenant.id);
  retP.set('refresh_alt','1');
  p.set('return_url',location.origin+'/?'+retP.toString());
  const qs=p.toString();
  return qs?baseUrl+(baseUrl.includes('?')?'&':'?')+qs:baseUrl;
}
const AUTH={KEY:'trail_saas_auth',BACKUP_KEY:'trail_saas_auth_backup',save(data){try{sessionStorage.setItem(this.KEY,JSON.stringify(data))}catch(e){}try{localStorage.setItem(this.BACKUP_KEY,JSON.stringify(data))}catch(e){}},load(){try{const d=JSON.parse(sessionStorage.getItem(this.KEY));if(d&&d.token)return d}catch(e){}try{const b=JSON.parse(localStorage.getItem(this.BACKUP_KEY));if(b&&b.token){sessionStorage.setItem(this.KEY,JSON.stringify(b));return b}}catch(e){}return null},clear(){try{sessionStorage.removeItem(this.KEY)}catch(e){}try{localStorage.removeItem(this.BACKUP_KEY)}catch(e){}},getToken(){const d=this.load();return d?d.token:null}};
const API_BASE='/api';
async function api(method,path,body){const opts={method,headers:{'Content-Type':'application/json'}};const tk=AUTH.getToken();if(tk)opts.headers['Authorization']='Bearer '+tk;if(body)opts.body=JSON.stringify(body);const res=await fetch(API_BASE+path,opts);const json=await res.json();if(!res.ok)throw new Error(json.error||'API Error');return json}
function apiGet(p){return api('GET',p)}
function apiPost(p,b){return api('POST',p,b)}
function apiPut(p,b){return api('PUT',p,b)}
function apiDel(p){return api('DELETE',p)}
const VALIDATION={MAX_NAME_LENGTH:20,MAX_CLASS_LENGTH:30,MAX_GAME_NAME_LENGTH:40,MAX_URL_LENGTH:500,HIRAGANA_PATTERN:/^[\u3040-\u309F\u30FC\u3000\s]+$/,URL_PATTERN:/^https?:\/\/.+/};
function validateName(name){if(!name||name.length===0)return'名前を入力してください';if(name.length>VALIDATION.MAX_NAME_LENGTH)return`${VALIDATION.MAX_NAME_LENGTH}文字以内で入力してください`;return null}
function validateHiragana(name){if(!name)return'名前を入力してください';if(!VALIDATION.HIRAGANA_PATTERN.test(name))return'ひらがなで入力してください';return null}
function validateUrl(url){if(!url)return null;if(url.length>VALIDATION.MAX_URL_LENGTH)return'URLが長すぎます';if(!VALIDATION.URL_PATTERN.test(url))return'https:// で始まるURLを入力してください';return null}
const LOGIN_SECURITY={maxAttempts:5,lockoutDuration:60000,attempts:0,lockedUntil:0,isLocked(){return Date.now()<this.lockedUntil},getRemainingSeconds(){return Math.ceil((this.lockedUntil-Date.now())/1000)},recordFailure(){this.attempts++;if(this.attempts>=this.maxAttempts){this.lockedUntil=Date.now()+this.lockoutDuration}},reset(){this.attempts=0;this.lockedUntil=0}};
const gamePlayTracker={KEY:'trail_saas_gameplay',sessions:[],currentPlay:null,load(){try{const d=JSON.parse(localStorage.getItem(this.KEY));if(d&&Array.isArray(d))this.sessions=d}catch(e){}},save(){try{localStorage.setItem(this.KEY,JSON.stringify(this.sessions.slice(0,1000)))}catch(e){}},startPlay(user,gameId,gameName){if(this.currentPlay)this.endPlay();this.currentPlay={user,gameId,gameName,startTs:Date.now()}},endPlay(){if(!this.currentPlay)return;const s=this.currentPlay;const dur=Date.now()-s.startTs;this.currentPlay=null;if(dur<3000)return;const now=new Date();const time=`${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;this.sessions.unshift({user:s.user,gameId:s.gameId,gameName:s.gameName,startTs:s.startTs,duration:dur,date:time});if(this.sessions.length>1000)this.sessions.length=1000;this.save();if(S.token&&S.tenant){apiPost('/t/'+S.tenant.slug+'/analytics/gameplay',{studentId:S.user?S.user.id:0,gameId:s.gameId,durationSeconds:Math.round(dur/1000)}).catch(()=>{})}},getPlayerStats(){const map={};this.sessions.forEach(s=>{const k=s.user;if(!map[k])map[k]={user:k,games:{},totalPlays:0,totalDuration:0};if(!map[k].games[s.gameId])map[k].games[s.gameId]={gameId:s.gameId,gameName:s.gameName,plays:0,duration:0};map[k].games[s.gameId].plays++;map[k].games[s.gameId].duration+=s.duration;map[k].totalPlays++;map[k].totalDuration+=s.duration});return Object.values(map).sort((a,b)=>b.totalPlays-a.totalPlays)},getGameStats(){const map={};this.sessions.forEach(s=>{const k=s.gameId;if(!map[k])map[k]={gameId:s.gameId,gameName:s.gameName,players:new Set(),plays:0,totalDuration:0};map[k].players.add(s.user);map[k].plays++;map[k].totalDuration+=s.duration});return Object.values(map).map(g=>({...g,uniquePlayers:g.players.size})).sort((a,b)=>b.plays-a.plays)},formatDuration(ms){const secs=Math.floor(ms/1000);if(secs<60)return`${secs}秒`;const mins=Math.floor(secs/60);if(mins<60)return`${mins}分`;const h=Math.floor(mins/60);const m=mins%60;return`${h}時間${m}分`}};
gamePlayTracker.load();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&gamePlayTracker.currentPlay)gamePlayTracker.endPlay()});
window.addEventListener('beforeunload',()=>gamePlayTracker.endPlay());

let S={screen:'landing',tenant:null,user:null,token:null,games:[],classes:[],students:[],coinLogs:[],badges:[],rankings:[],adminTab:'activity',portalTab:'home',selectedCategory:'すべて',selectedRankGame:null,loginClass:null,loginTab:'student',loading:false,dashboard:null,loginLogs:[],gameplay:null,parentTokens:null,streak:null,studentDashboard:null,dashStatPeriod:'today'};
(function restore(){const d=AUTH.load();if(!d)return;S.token=d.token;S.tenant=d.tenant;S.user=d.user;S.screen=d.screen||'landing'})();

// 🆕 URLパラメータからトークン・認証情報を受け取る（ゲームからの帰還時）
let _needRefreshAlt=false;
(function receiveUrlParams(){
  const params=new URLSearchParams(window.location.search);
  const token=params.get('token');
  const studentId=params.get('student_id');
  const studentName=params.get('student_name');
  const tenantSlug=params.get('tenant_slug');
  const tenantId=params.get('tenant_id');
  const className=params.get('class_name');
  const refreshAlt=params.get('refresh_alt');

  // トークンがURLにある場合 → セッションを復元
  if(token){
    // 既存セッションがあればベースにする
    const existing=AUTH.load();
    // tenant: 既存値を優先。URLに tenant_slug があれば上書き
    const tenant=existing&&existing.tenant&&existing.tenant.slug?existing.tenant:{id:tenantId?parseInt(tenantId):null,slug:tenantSlug||null,name:''};
    if(tenantSlug)tenant.slug=tenantSlug;
    if(tenantId)tenant.id=parseInt(tenantId);
    const user=existing&&existing.user?existing.user:{id:studentId?parseInt(studentId):null,name:studentName||'',className:className||'',role:'student'};
    if(studentId&&user)user.id=parseInt(studentId);
    if(studentName&&user)user.name=studentName;
    if(className&&user)user.className=className;

    S.token=token;
    S.tenant=tenant;
    S.user=user;
    S.screen='portal';
    // slug が有効な場合のみ保存（null slug でストレージを汚染しない）
    if(tenant.slug)AUTH.save({token:token,tenant:tenant,user:user,screen:'portal'});
  }

  // refresh_alt=1 → データ再読み込みフラグ
  if(refreshAlt==='1')_needRefreshAlt=true;

  // URLをクリーンアップ（パラメータを除去）
  if(token||studentId||refreshAlt){
    const clean=new URL(window.location);
    ['token','student_id','student_name','tenant_slug','tenant_id','class_name','refresh_alt'].forEach(k=>clean.searchParams.delete(k));
    window.history.replaceState({},'',clean.toString());
  }
})();

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function createStars(){const c=document.getElementById('stars');for(let i=0;i<50;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';s.style.animationDuration=(2+Math.random()*3)+'s';s.style.width=s.style.height=(1+Math.random()*2)+'px';c.appendChild(s)}}

// ★ 0-15: ALTポップアップ
let _altTimer=null;
function showAltPopup(alt){
  if(!alt||!alt.total||alt.total<=0){
    // ALT 0 でもキャップ到達なら通知表示
    if(alt&&alt.capInfo&&alt.capInfo.capped){
      const el=document.getElementById('alt-popup');if(!el)return;
      document.getElementById('alt-popup-total').textContent='ALT 上限到達';
      document.getElementById('alt-popup-awards').innerHTML=
        `<div class="alt-popup-award"><span class="alt-popup-award-lbl">🔒 このゲームのALT上限に達しました</span></div>
         <div class="alt-popup-award"><span class="alt-popup-award-lbl">(${alt.capInfo.gameLifetimeAlt}/${alt.capInfo.cap}) ランクアップで解放！</span></div>`;
      el.classList.add('show');
      clearTimeout(_altTimer);
      _altTimer=setTimeout(()=>{el.classList.remove('show');if(S.tenant)loadTenantData()},4000);
    }
    return;
  }
  const el=document.getElementById('alt-popup');if(!el)return;
  document.getElementById('alt-popup-total').textContent='+'+alt.total+' ALT';
  let awardsHtml=(alt.awards||[]).map(a=>
    `<div class="alt-popup-award"><span class="alt-popup-award-lbl">${esc(a.label)}</span><span class="alt-popup-award-amt">${a.amount>=0?'+':''}${a.amount}</span></div>`
  ).join('');
  if(alt.capInfo&&alt.capInfo.capped){
    awardsHtml+=`<div class="alt-popup-award"><span class="alt-popup-award-lbl" style="color:rgba(255,100,100,0.8)">🔒 ゲーム上限到達 (${alt.capInfo.gameLifetimeAlt+alt.capInfo.alt}/${alt.capInfo.cap})</span></div>`;
  }
  document.getElementById('alt-popup-awards').innerHTML=awardsHtml;
  el.classList.add('show');
  clearTimeout(_altTimer);
  _altTimer=setTimeout(()=>{el.classList.remove('show');if(S.tenant)loadTenantData()},3500);
}

// ★ 0-15: ストリーク取得
async function loadStreak(){
  if(!S.tenant||!S.user||!S.user.id)return;
  try{const r=await apiGet('/streaks/'+S.user.id+'?tenant_id='+encodeURIComponent(S.tenant.id));S.streak=r;render()}catch(e){}
}

// ★ 生徒ダッシュボード取得
async function loadStudentDashboard(){
  if(!S.tenant||!S.user)return;
  try{S.studentDashboard=await apiGet('/t/'+S.tenant.slug+'/student-dashboard')}catch(e){S.studentDashboard={}}
  render();
}

// ★ 0-15: ストリークウィジェット描画
function renderStreakWidget(){
  if(!S.streak)return'';
  const sk=S.streak.streak||S.streak;
  const current=sk.current_streak||0;
  const max=sk.max_streak||0;
  const alive=sk.isAlive||false;
  const cal=S.streak.calendar||[];
  const dots=cal.slice(0,7).map(d=>`<div class="sw-dot${d.played?' played':''}">${d.played?'🔥':''}</div>`).join('');
  const flame=current>=7?'🔥':current>=3?'🔶':'🔸';
  const status=alive
    ?`<span style="color:#4CAF50">継続中✅</span>`
    :`<span style="color:#E57373">${current>0?'途切れた...':'未プレイ'}</span>`;
  return`<div class="streak-widget"><div class="sw-flame">${flame}</div><div class="sw-info"><div class="sw-current">${current}<span style="font-size:.7rem;opacity:.7;font-family:inherit"> 日連続</span></div><div class="sw-label">最長: ${max}日 &nbsp;${status}</div></div><div class="sw-dots">${dots}</div></div>`;
}

async function loadTenantData(){if(!S.tenant||!S.tenant.slug){console.error('[loadTenantData] tenant slug が未設定');return}const slug=S.tenant.slug;S.loading=true;render();try{const[gRes,cRes]=await Promise.all([apiGet('/t/'+slug+'/games'),apiGet('/t/'+slug+'/classes')]);S.games=gRes.games||[];S.classes=cRes.classes||[];try{const rRes=await apiGet('/t/'+slug+'/rankings');S.rankings=rRes.rankings||[]}catch(e){}if(S.user&&S.user.role&&S.user.role!=='student'){try{const[sRes,coRes,bRes]=await Promise.all([apiGet('/t/'+slug+'/students'),apiGet('/t/'+slug+'/coins'),apiGet('/t/'+slug+'/badges')]);S.students=sRes.students||[];S.coinLogs=coRes.logs||[];S.badges=bRes.summary||[]}catch(e){console.error(e)}}else if(S.user&&S.user.role==='student'){try{const coRes=await apiGet('/t/'+slug+'/coins');S.coinLogs=coRes.logs||[]}catch(e){}}}catch(e){console.error('loadData:',e);toast('データ読み込みエラー')}S.loading=false;render();

// ★ 生徒ダッシュボード描画
function renderPortalDashboard(){
  const d=S.studentDashboard;
  if(!d||!d.stats){if(!S.studentDashboard)loadStudentDashboard();return'<div class="no-data">読み込み中...</div>'}

  // ① レベル・ストリーク
  const rk=d.rank||{};
  const pct=rk.nextAlt?Math.min(100,Math.round((rk.currentAlt||0)/(rk.nextAlt)*100)):100;
  const levelSection=`<div class="dash-section"><div class="dash-level-box">
    <div class="dash-rank-label">${esc(rk.label||'Fランク')}</div>
    <div class="dash-rank-name">${esc(rk.name||'見習い探究者')}</div>
    <div class="dash-progress-wrap"><div class="dash-progress-track"><div class="dash-progress-fill" style="width:${pct}%"></div></div>
    <div class="dash-progress-text"><span>${rk.currentAlt||0} ALT</span><span>${rk.nextAlt?rk.nextAlt+' ALT':'MAX'}</span></div></div>
    <div class="dash-streak-row">🔥 ${d.streak||0}日連続ログイン！</div>
  </div></div>`;

  // ② 今日のミッション
  const ms=d.todayMission||{};
  const missionSection=`<div class="dash-section dash-mission-card${ms.completed?' completed':''}">
    <div class="dash-section-title">🎯 TODAY'S MISSION</div>
    <div class="dash-mission-desc">${ms.completed?'✅ ':''}${esc(ms.description||'ミッションなし')}</div>
    ${ms.completed?'<div style="font-size:.75rem;color:var(--accent-green);font-weight:700">クリア済み！おめでとう！🎉</div>':'<button class="dash-mission-btn" data-dash-go-games>挑戦する ▶</button>'}
  </div>`;

  // ③ 統計タブ（今日/今週/累計）
  const period=S.dashStatPeriod||'today';
  const periodData=d.stats[period]||{alt:0,plays:0,minutes:0};
  const statsSection=`<div class="dash-section">
    <div class="dash-section-title">📊 STATS</div>
    <div class="dash-stat-tabs">
      <button class="dash-stat-tab${period==='today'?' active':''}" data-dash-period="today">今日</button>
      <button class="dash-stat-tab${period==='week'?' active':''}" data-dash-period="week">今週</button>
      <button class="dash-stat-tab${period==='total'?' active':''}" data-dash-period="total">累計</button>
    </div>
    <div class="dash-stat-grid">
      <div class="dash-stat-item"><div class="dash-stat-val" style="color:var(--accent-gold)">${periodData.alt}</div><div class="dash-stat-lbl">ALT獲得</div></div>
      <div class="dash-stat-item"><div class="dash-stat-val" style="color:var(--accent-cyan)">${periodData.plays}</div><div class="dash-stat-lbl">プレイ数</div></div>
      <div class="dash-stat-item"><div class="dash-stat-val" style="color:var(--accent-purple)">${periodData.minutes}</div><div class="dash-stat-lbl">分</div></div>
    </div>
  </div>`;

  // ④ カテゴリ別能力値
  const cats=d.categoryStats||[];
  const maxPlays=cats.length?Math.max(...cats.map(c=>c.plays),1):1;
  const bestCat=cats.length?cats.reduce((a,b)=>((a.plays>0&&(a.correct/a.plays)>=(b.plays>0?(b.correct/b.plays):0))?a:b),cats[0]):null;
  const catRows=cats.length?cats.map(c=>{
    const pctVal=c.plays>0?Math.round(c.correct/c.plays*100):0;
    const isBest=bestCat&&c.category===bestCat.category&&c.plays>0;
    return`<div class="dash-cat-row">
      <div class="dash-cat-emoji">${esc(c.emoji)}</div>
      <div class="dash-cat-name">${esc(c.category)}</div>
      <div class="dash-cat-bar-wrap"><div class="dash-cat-bar" style="width:${pctVal}%"></div></div>
      <div class="dash-cat-pct">${pctVal}%</div>
      ${isBest?'<div class="dash-cat-badge">得意！</div>':''}
    </div>`;
  }).join(''):'<div style="color:var(--text-dim);font-size:.8rem;text-align:center;padding:12px">まだプレイ記録がありません</div>';
  const catSection=`<div class="dash-section"><div class="dash-section-title">📚 SKILLS</div>${catRows}</div>`;

  // ⑤ バッジコレクション
  const bdgs=d.badges||[];
  const badgeItems=bdgs.map(b=>`<div class="dash-badge-item ${b.earned?'earned':'locked'}">
    <div class="dash-badge-emoji">${b.earned?esc(b.emoji):'❓'}</div>
    <div class="dash-badge-name">${b.earned?esc(b.name):'???'}</div>
  </div>`).join('');
  const earnedCount=bdgs.filter(b=>b.earned).length;
  const badgeSection=`<div class="dash-section"><div class="dash-section-title">🏅 BADGES (${earnedCount}/${bdgs.length})</div><div class="dash-badge-grid">${badgeItems||'<div style="color:var(--text-dim);font-size:.8rem">バッジなし</div>'}</div></div>`;

  // ⑥ ゲーム別ベストスコア
  const scores=d.bestScores||[];
  const scoreCards=scores.length?scores.map(s=>`<div class="dash-score-card">
    <div class="dash-score-emoji">${esc(s.game_emoji||'🎮')}</div>
    <div class="dash-score-name">${esc(s.game_name)}</div>
    <div class="dash-score-val">${esc(s.score)}</div>
    <div class="dash-score-lbl">${esc(s.score_label||'点')}</div>
  </div>`).join(''):'<div style="color:var(--text-dim);font-size:.8rem;text-align:center;padding:12px">まだスコアがありません</div>';
  const scoreSection=`<div class="dash-section"><div class="dash-section-title">🏆 BEST SCORES</div><div class="dash-score-cards">${scoreCards}</div></div>`;

  // ⑦ 今週のランキング
  const wr=d.weeklyRanking||[];
  const myName=S.user?S.user.name:'';
  const weeklyRows=wr.length?wr.slice(0,5).map(r=>{
    const isMe=r.student_name===myName;
    const medal=r.rank===1?'👑':r.rank===2?'🥈':r.rank===3?'🥉':'';
    return`<div class="dash-weekly-row${isMe?' me':''}">
      <div class="dash-weekly-rank">${medal||r.rank}</div>
      <div class="dash-weekly-name">${esc(r.student_name)}${isMe?' ← 自分':''}</div>
      <div class="dash-weekly-alt">${r.total_coins} ALT</div>
    </div>`;
  }).join(''):'<div style="color:var(--text-dim);font-size:.8rem;text-align:center;padding:12px">まだデータがありません</div>';
  const weeklySection=`<div class="dash-section"><div class="dash-section-title">🏅 WEEKLY RANKING</div><div class="dash-weekly-list">${weeklyRows}</div></div>`;

  // ⑧ 学習カレンダー（今月）
  const cal=d.calendar||[];
  const calMap={};cal.forEach(c=>{calMap[c.date]={plays:c.plays,alt:c.alt}});
  const now=new Date(Date.now()+9*60*60*1000);
  const year=now.getUTCFullYear();const month=now.getUTCMonth();
  const firstDay=new Date(Date.UTC(year,month,1));
  const daysInMonth=new Date(Date.UTC(year,month+1,0)).getUTCDate();
  const startDow=firstDay.getUTCDay();
  const todayStr=now.toISOString().slice(0,10);
  const heads=['日','月','火','水','木','金','土'].map(d=>`<div class="dash-cal-head">${d}</div>`).join('');
  let calCells='';
  for(let i=0;i<startDow;i++)calCells+='<div class="dash-cal-day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const info=calMap[ds];
    const isToday=ds===todayStr;
    let cls='dash-cal-day';
    if(info&&info.plays>0){cls+=' has-play';if(info.alt>=20)cls+=' fire';else if(info.alt>=10)cls+=' hot'}
    if(isToday)cls+=' today';
    calCells+=`<div class="${cls}">${d}</div>`;
  }
  const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const calSection=`<div class="dash-section"><div class="dash-section-title">📅 ${monthNames[month]} CALENDAR</div><div class="dash-cal">${heads}${calCells}</div></div>`;

  return levelSection+missionSection+statsSection+catSection+badgeSection+scoreSection+weeklySection+calSection;
}

function renderPortalRanking(){const ranking=S.rankings||[];const globalHtml=ranking.slice(0,10).map((r,i)=>{const cls=i===0?' rank-gold':i===1?' rank-silver':i===2?' rank-bronze':'';const num=i<3?'<div class="rank-medal">'+(i===0?'👑':i===1?'🥈':'🥉')+'</div>':'<div class="rank-num">'+(i+1)+'</div>';const isMe=S.user&&r.student_name===S.user.name&&i>=3?' style="border-color:rgba(0,229,255,0.25)"':'';return`<div class="rank-item${cls}"${isMe}>${num}<div class="rank-name">${esc(r.student_name||r.name||'')}<span style="font-size:.65rem;color:var(--text-dim);margin-left:6px">${esc(r.class_name||'')}</span></div><div class="rank-alt">${r.total_coins||0} ALT</div></div>`}).join('');const byGame={};(S.rankings||[]).forEach(r=>{if(r.game_name){const k=r.game_name;if(!byGame[k])byGame[k]={name:k,emoji:r.game_emoji||'🎮',id:r.game_id,entries:[]};byGame[k].entries.push(r)}});const gamesWithRank=Object.values(byGame);if(!S.selectedRankGame&&gamesWithRank.length>0)S.selectedRankGame=gamesWithRank[0].id;const gameTabsHtml=gamesWithRank.map(g=>`<button class="game-rank-tab ${S.selectedRankGame===g.id?'active':''}" data-rgid="${g.id}">${g.emoji} ${esc(g.name)}</button>`).join('');let gameRankContent='<div style="color:var(--text-dim);font-size:.85rem;text-align:center;padding:20px">まだゲームの記録がありません</div>';if(S.selectedRankGame){const selGame=gamesWithRank.find(g=>g.id===S.selectedRankGame);if(selGame&&selGame.entries.length>0){const rows=selGame.entries.slice(0,10).map((r,i)=>{const medal=i===0?'👑':i===1?'🥈':i===2?'🥉':'';const numStr=medal?`<span style="font-size:1.1rem">${medal}</span>`:`<span style="font-family:'Orbitron';font-size:.8rem;color:var(--text-dim)">${i+1}</span>`;const isMe=S.user&&r.student_name===S.user.name?'style="background:rgba(0,144,217,0.05);border-color:rgba(0,229,255,0.2)"':'';return`<tr ${isMe}><td style="width:40px;text-align:center">${numStr}</td><td><strong>${esc(r.student_name)}</strong></td><td class="game-rank-table"><span class="rank-score">${esc(r.score)}</span><span class="score-label">${esc(r.score_label||'')}</span></td></tr>`}).join('');gameRankContent=`<div class="tbl-wrap game-rank-table"><table><tr><th>#</th><th>プレイヤー</th><th>スコア</th></tr>${rows}</table></div>`}}return`<div class="section-title">🏆 総合ランキング</div><div class="ranking-section"><div class="ranking-list">${globalHtml||'<div class="no-data">まだ記録がありません</div>'}</div></div><div class="section-title" style="margin-top:10px">🎮 ゲーム別ランキング</div>${gamesWithRank.length?`<div class="game-rank-tabs">${gameTabsHtml}</div>${gameRankContent}`:'<div style="color:var(--text-dim);font-size:.85rem;padding:16px;background:var(--bg-card);border-radius:12px;text-align:center">まだゲームの記録がありません</div>'}`}
function renderPortalGames(){const usedCats=[...new Set(S.games.map(g=>g.category||'その他'))];const catBtns=['すべて',...CATEGORIES.filter(c=>usedCats.includes(c))].map(c=>{const count=c==='すべて'?S.games.length:S.games.filter(g=>g.category===c).length;return`<button class="cat-btn ${S.selectedCategory===c?'active':''}" data-cat="${c}">${c}${c!=='すべて'?` (${count})`:''}</button>`}).join('');const filtered=S.selectedCategory==='すべて'?S.games:S.games.filter(g=>g.category===S.selectedCategory);const cards=filtered.map(g=>{const hasUrl=g.url&&g.url.trim();const tag=hasUrl?'a':'div';const gameUrl=hasUrl?buildGameUrl(g.url.trim()):'';const href=hasUrl?` href="${esc(gameUrl)}" target="_blank" rel="noopener"`:'';return`<${tag} class="game-card" data-gid="${g.id}"${href}><span class="game-emoji">${esc(g.emoji)}</span><div class="game-name">${esc(g.name)}</div><div class="game-link-hint">${hasUrl?'▶ タップでプレイ':'準備中...'}</div></${tag}>`}).join('');return`<div class="category-filter">${catBtns}</div><div class="game-grid">${cards}</div>`}
function renderPortalHistory(){const name=S.user?S.user.name:'';const logs=S.coinLogs.filter(l=>l.student_name===name);const rows=logs.length?logs.slice(0,30).map(l=>`<tr><td>${esc(l.game_emoji||'🎮')} ${esc(l.game_name||'—')}</td><td class="coin-plus">+${l.amount}</td><td style="color:var(--text-dim);font-size:.75rem">${esc(l.created_at||'')}</td></tr>`).join(''):'<tr><td colspan="3" class="no-data">まだ記録がありません</td></tr>';return`<div class="tbl-wrap"><table><tr><th>ゲーム</th><th>ALT</th><th>日付</th></tr>${rows}</table></div>`}
function renderAdmin(){const tabs=`<div class="admin-tabs"><button class="admin-tab ${S.adminTab==='activity'?'active':''}" data-tab="activity">📡 監視</button><button class="admin-tab ${S.adminTab==='loginlog'?'active':''}" data-tab="loginlog">🚪 入退室</button><button class="admin-tab ${S.adminTab==='coins'?'active':''}" data-tab="coins">💰 ALT付与</button><button class="admin-tab ${S.adminTab==='badges'?'active':''}" data-tab="badges">🏅 バッジ</button><button class="admin-tab ${S.adminTab==='games'?'active':''}" data-tab="games">🎮 ゲーム</button><button class="admin-tab ${S.adminTab==='rankings'?'active':''}" data-tab="rankings">🏆 ランキング</button><button class="admin-tab ${S.adminTab==='usage'?'active':''}" data-tab="usage">🕹️ 利用状況</button><button class="admin-tab ${S.adminTab==='summary'?'active':''}" data-tab="summary">📊 一覧</button></div>`;let content='';if(S.adminTab==='activity')content=renderAdminActivity();else if(S.adminTab==='loginlog')content=renderAdminLoginLog();else if(S.adminTab==='coins')content=renderAdminCoins();else if(S.adminTab==='badges')content=renderAdminBadges();else if(S.adminTab==='games')content=renderAdminGames();else if(S.adminTab==='rankings')content=renderAdminRankings();else if(S.adminTab==='usage')content=renderAdminGameUsage();else content=renderAdminSummary();return`<div class="admin-panel"><div class="header"><div class="header-logo">TRAIL GP3</div><div class="header-right"><div class="user-badge"><div class="user-avatar" style="background:linear-gradient(135deg,var(--accent-gold),var(--accent-pink))">★</div>${esc(S.user?S.user.displayName:'管理者')}</div><button class="logout-btn" id="refreshBtn" style="border-color:var(--accent-cyan);color:var(--accent-cyan)">🔄 更新</button><button class="logout-btn" id="logoutBtn">ログアウト</button></div></div>${tabs}${content}</div>`}
function renderAdminActivity(){const d=S.dashboard;if(!d){loadDashboard().then(()=>render());return'<div class="no-data">読み込み中...</div>'}const st=d.stats||{};return`<div class="activity-stats"><div class="stat-card stat-gold"><div class="stat-value">${st.totalCoins||0}</div><div class="stat-label">総ALT発行数</div></div><div class="stat-card stat-cyan"><div class="stat-value">${st.totalStudents||0}</div><div class="stat-label">登録生徒数</div></div><div class="stat-card stat-green"><div class="stat-value">${st.totalGames||0}</div><div class="stat-label">ゲーム数</div></div><div class="stat-card stat-orange"><div class="stat-value">${st.totalBadges||0}</div><div class="stat-label">総バッジ数</div></div><div class="stat-card stat-purple"><div class="stat-value">${st.todayActive||0}</div><div class="stat-label">今日のアクティブ</div></div></div><div class="section-title">🏫 クラス別統計</div><div class="game-list-admin">${(d.classStats||[]).map(c=>`<div class="game-list-item"><div class="game-list-item-info"><div><strong>${esc(c.name)}</strong><div style="font-size:.7rem;color:var(--text-dim);margin-top:2px">${c.student_count}名</div></div></div><div style="text-align:right"><div class="total-coins">${c.total_coins} ALT</div></div></div>`).join('')}</div><div class="section-title" style="margin-top:16px">🎮 ゲーム利用ランキング</div><div class="tbl-wrap"><table><tr><th>ゲーム</th><th>回数</th><th>利用者</th></tr>${(d.gameUsage||[]).map(g=>`<tr><td>${esc(g.emoji)} ${esc(g.name)}</td><td style="font-family:'Orbitron';color:var(--accent-cyan)">${g.play_count}</td><td>${g.unique_players}人</td></tr>`).join('')||'<tr><td colspan="3" class="no-data">データなし</td></tr>'}</table></div><div class="section-title" style="margin-top:16px">📡 最近のアクティビティ</div><div class="activity-feed">${(d.recentActivity||[]).map(a=>{const icons={coin:'💰',badge:'🏅',player:'👤',game:'🎮',security:'🔒',login:'🚪'};return`<div class="activity-item"><div class="activity-icon">${icons[a.type]||'📋'}</div><div class="activity-body"><strong>${esc(a.actor)}</strong><p>${esc(a.detail)}</p></div><div class="activity-time">${esc(a.created_at||'')}</div></div>`}).join('')||'<div class="no-data">まだアクティビティがありません</div>'}</div>`}
function renderAdminCoins(){const sOpts=S.students.map(s=>`<option value="${s.id}">${esc(s.name)}（${esc(s.className)}）</option>`).join('');const gOpts=S.games.map(g=>`<option value="${g.id}">${esc(g.emoji)} ${esc(g.name)}</option>`).join('');const rows=S.coinLogs.slice(0,30).map(l=>`<tr><td>${esc(l.student_name)}</td><td>${esc(l.game_emoji||'🎮')} ${esc(l.game_name||'—')}</td><td class="coin-plus">+${l.amount}</td><td style="color:var(--text-dim);font-size:.75rem">${esc(l.created_at)}</td></tr>`).join('');return`<div class="admin-form"><h3>💰 ALT ADD</h3><div class="form-stack"><div class="form-row-2"><div class="form-group"><label>生徒</label><select id="coinStudent">${sOpts}</select></div><div class="form-group"><label>ゲーム</label><select id="coinGame">${gOpts}</select></div></div><div class="form-group"><label>ALT数</label><input type="number" id="coinAmount" value="10" min="1"/></div><button class="btn-primary btn-gold" id="addCoinBtn">付与</button></div><hr style="border:none;border-top:1px solid rgba(0,0,0,0.06);margin:16px 0"><div class="form-stack"><div class="form-row-2"><div class="form-group"><label>新しい生徒</label><input type="text" id="newStudentName" placeholder="なまえ"/></div><div class="form-group"><label>クラス</label><select id="newStudentClass">${S.classes.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}</select></div></div><button class="btn-primary btn-purple" id="addStudentBtn">追加</button></div></div><div class="section-title">最近の付与ログ</div><div class="tbl-wrap"><table><tr><th>生徒</th><th>ゲーム</th><th>ALT</th><th>日付</th></tr>${rows||'<tr><td colspan="4" class="no-data">まだ記録がありません</td></tr>'}</table></div>`}
function renderAdminBadges(){const sOpts=S.students.map(s=>{const b=getStudentBadges(s.name);return`<option value="${s.id}">${esc(s.name)}（🏅${b}）</option>`}).join('');const list=S.badges.map(b=>`<div class="game-list-item"><div class="game-list-item-info"><div><strong>${esc(b.student_name)}</strong><div style="font-size:.7rem;color:var(--text-dim)">${esc(b.class_name)}</div></div></div><div style="font-family:'Orbitron';font-weight:700;color:var(--accent-orange);font-size:1.1rem">${b.badge_count}</div></div>`).join('');return`<div class="badge-manage-form"><h3>🏅 景品交換バッジ</h3><div class="form-stack"><div class="form-group"><label>生徒</label><select id="badgeStudent">${sOpts}</select></div><button class="btn-primary btn-orange" id="addBadgeBtn">🏅 バッジを付与</button></div></div><div class="section-title">バッジ一覧</div><div class="game-list-admin">${list||'<div class="no-data">バッジなし</div>'}</div>`}
function renderAdminGames(){const catOpts=CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('');const items=S.games.map(g=>`<div class="game-list-item" style="flex-wrap:wrap"><div class="game-list-item-info"><span>${esc(g.emoji)}</span><div><strong>${esc(g.name)}</strong>${g.category?`<span class="game-item-cat">${esc(g.category)}</span>`:''}</div></div><button class="delete-btn" data-del-game="${g.id}">削除</button><div style="width:100%;display:flex;gap:6px;margin-top:6px;align-items:center"><input class="url-edit" data-url-game="${g.id}" value="${esc(g.url||'')}" placeholder="URLを入力..." style="flex:1;padding:6px 10px;background:rgba(0,0,0,0.02);border:1.5px solid rgba(0,0,0,0.08);border-radius:6px;font-size:.75rem;font-family:inherit;color:var(--text-primary);outline:none"/><button class="url-save-btn" data-save-game="${g.id}" style="padding:6px 12px;background:var(--accent-cyan);border:none;border-radius:6px;color:#fff;font-size:.7rem;font-weight:700;cursor:pointer;white-space:nowrap">保存</button></div></div>`).join('');return`<div class="game-manage-form"><h3>🎮 ADD GAME</h3><div class="form-stack"><div class="form-row-2"><div class="form-group"><label>ゲーム名</label><input type="text" id="newGameName" placeholder="ゲーム名"/></div><div class="form-group"><label>カテゴリ</label><select id="newGameCat">${catOpts}</select></div></div><div class="form-group"><label>リンクURL</label><input type="text" id="newGameUrl" placeholder="https://..."/></div><div class="form-group"><label>絵文字</label><input type="text" id="newGameEmoji" placeholder="🎲" maxlength="2" style="text-align:center"/></div><button class="btn-primary btn-green" id="addGameBtn">追加</button></div></div><div class="section-title">登録済みゲーム</div><div class="game-list-admin">${items}</div>`}
function renderAdminRankings(){if(!S.rankings||S.rankings.length===0){return`<div class="no-data" style="background:var(--bg-card);border-radius:12px;padding:30px"><div style="font-size:2rem;margin-bottom:10px">🎮</div>まだゲームランキングの記録がありません。</div>`}const byGame={};S.rankings.forEach(r=>{const k=r.game_name||'unknown';if(!byGame[k])byGame[k]={name:k,emoji:r.game_emoji||'🎮',entries:[]};byGame[k].entries.push(r)});const sections=Object.values(byGame).map(g=>{const rows=g.entries.slice(0,20).map((r,i)=>{const medal=i===0?'👑':i===1?'🥈':i===2?'🥉':'';return`<tr><td style="text-align:center">${medal||(i+1)}</td><td><strong>${esc(r.student_name)}</strong></td><td><span class="rank-score">${esc(r.score)}</span><span class="score-label">${esc(r.score_label||'')}</span></td><td><button class="delete-btn" data-del-rank="${r.id}" style="font-size:.6rem;padding:2px 8px">削除</button></td></tr>`}).join('');return`<div style="margin-bottom:20px"><div class="section-title">${g.emoji} ${esc(g.name)}（${g.entries.length}人）</div><div class="tbl-wrap"><table><tr><th>#</th><th>プレイヤー</th><th>スコア</th><th></th></tr>${rows}</table></div></div>`}).join('');return`<div class="game-manage-form"><h3 style="color:var(--accent-cyan)">🏆 GAME RANKINGS</h3></div>${sections}`}
function renderAdminSummary(){const sorted=[...S.students].sort((a,b)=>(b.totalCoins||0)-(a.totalCoins||0));const rows=sorted.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td style="font-size:.7rem;color:var(--text-dim)">${esc(s.className)}</td><td class="total-coins">${s.totalCoins||0}</td><td style="text-align:center;color:var(--accent-orange)">${(s.totalBadges||0)>0?'🏅'+s.totalBadges:'—'}</td><td style="text-align:center"><button class="delete-btn" style="border-color:rgba(0,144,217,0.3);color:var(--accent-cyan);font-size:.6rem;padding:3px 8px" data-parent-link="${s.id}" data-sname="${esc(s.name)}">📩 発行</button></td></tr>`).join('');const clsTags=S.classes.map(c=>`<span class="cat-tag">${esc(c.name)}<button class="cat-del" data-del-cls="${c.id}">✕</button></span>`).join('');const commentStuOpts=S.students.map(s=>`<option value="${s.id}">${esc(s.name)}（${esc(s.className)}）</option>`).join('');const templates=['最近○○に夢中で、自分から質問する場面が増えました','前回から△△が大きく伸びました！ぜひ褒めてあげてください','来月は□□に挑戦する予定です','着実に成長しています。焦らず見守ってあげてください'];const tplBtns=templates.map(t=>`<button class="cat-btn comment-tpl" style="font-size:.7rem;padding:4px 10px" data-tpl="${esc(t)}">${esc(t.substring(0,15))}...</button>`).join('');return`<div class="section-title">📊 全生徒一覧</div><div class="tbl-wrap"><table><tr class="summary-th"><th>生徒</th><th>クラス</th><th>ALT</th><th>🏅</th><th>保護者</th></tr>${rows||'<tr><td colspan="5" class="no-data">生徒がいません</td></tr>'}</table></div><div class="cat-manage-form" style="margin-top:20px"><h3>🏫 クラス管理</h3><div class="form-stack"><div class="form-group"><label>新しいクラス</label><input type="text" id="newClassName" placeholder="クラス名"/></div><button class="btn-primary btn-purple" id="addClassBtn">追加</button></div><div class="cat-list">${clsTags}</div></div><div class="badge-manage-form" style="margin-top:20px"><h3 style="color:var(--accent-cyan)">✉️ 先生コメント（保護者ページ用）</h3><div class="form-stack"><div class="form-group"><label>生徒</label><select id="commentStudent">${commentStuOpts}</select></div><div class="form-group"><label>コメント</label><input type="text" id="commentText" placeholder="最近○○に夢中で、自分から質問する場面が増えました" maxlength="200"/></div><button class="btn-primary btn-purple" id="saveCommentBtn">💬 コメント保存</button></div><div style="margin-top:10px;font-size:.7rem;color:var(--text-dim)">テンプレート（タップで入力）：</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">${tplBtns}</div></div>${renderTokenList()}`}
function renderTokenList(){if(S.parentTokens===null){loadParentTokens();return`<div style="margin-top:20px;padding:16px;background:var(--bg-card);border:1.5px solid rgba(0,0,0,0.06);border-radius:14px"><div style="font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--accent-cyan);margin-bottom:8px">📩 発行済み保護者リンク</div><div style="color:var(--text-dim);font-size:.8rem;text-align:center;padding:12px">読み込み中...</div></div>`}const tokens=S.parentTokens;const rows=tokens.length?tokens.map(t=>{const url=location.origin+'/parent.html?token='+t.token;const created=t.created_at?new Date(t.created_at).toLocaleDateString('ja-JP'):'—';const expires=t.expires_at?new Date(t.expires_at).toLocaleDateString('ja-JP'):'無期限';return`<div style="display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:8px 10px;background:rgba(0,0,0,0.02);border-radius:8px;margin-bottom:6px;font-size:.8rem"><div><span style="font-weight:700;color:var(--text-primary)">${esc(t.student_name||'ID:'+t.student_id)}</span><span style="font-size:.65rem;color:var(--text-dim);margin-left:6px">${created}発行 / ${expires}</span></div><button data-copy-token="${esc(url)}" style="background:rgba(0,144,217,0.08);color:var(--accent-cyan);border:1px solid rgba(0,144,217,0.2);border-radius:4px;padding:3px 8px;font-size:.65rem;cursor:pointer">📋</button><a href="${esc(url)}" target="_blank" style="background:rgba(44,181,98,0.08);color:var(--accent-green);border:1px solid rgba(44,181,98,0.2);border-radius:4px;padding:3px 8px;font-size:.65rem;text-decoration:none">👁</a><button data-revoke-token="${t.id}" data-sname="${esc(t.student_name||'')}" style="background:rgba(224,80,112,0.06);color:var(--accent-pink);border:1px solid rgba(224,80,112,0.2);border-radius:4px;padding:3px 8px;font-size:.65rem;cursor:pointer">🗑</button></div>`}).join(''):`<div style="color:var(--text-dim);font-size:.8rem;text-align:center;padding:12px">発行済みリンクはありません</div>`;return`<div style="margin-top:20px;padding:16px;background:var(--bg-card);border:1.5px solid rgba(0,0,0,0.06);border-radius:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--accent-cyan)">📩 発行済み保護者リンク（${tokens.length}件）</div><button id="refreshTokensBtn" style="background:none;color:var(--text-dim);border:1px solid rgba(0,0,0,0.08);border-radius:6px;padding:3px 10px;font-size:.65rem;cursor:pointer">🔄 更新</button></div>${rows}</div>`}
function renderAdminLoginLog(){if(!S.loginLogs.length){loadLoginLogs().then(()=>render());return'<div class="no-data">読み込み中...</div>'}const active=S.loginLogs.filter(l=>!l.logout_at);const onlineHtml=active.length?active.map(s=>{const dur=formatDurationFromDate(s.login_at);return`<div class="online-chip"><span class="online-dot"></span>${esc(s.student_name)}<span style="font-size:.65rem;color:var(--text-dim)">${esc(s.class_name)}</span><span class="duration-badge">${dur}</span></div>`}).join(''):'<div style="color:var(--text-dim);font-size:.85rem">現在オンラインのユーザーはいません</div>';const rows=S.loginLogs.slice(0,100).map(s=>{const dur=s.duration_seconds?formatSeconds(s.duration_seconds):(s.logout_at?'—':`<span style="color:var(--accent-green)">滞在中</span>`);return`<tr><td>${esc(s.student_name)}</td><td><span style="font-size:.75rem;color:var(--text-dim)">${esc(s.class_name)}</span></td><td style="font-size:.8rem">${esc(s.login_at||'')}</td><td style="font-size:.8rem">${s.logout_at?esc(s.logout_at):'—'}</td><td class="duration-badge">${dur}</td></tr>`}).join('');return`<div class="section-title">🟢 現在オンライン（${active.length}名）</div><div class="online-list">${onlineHtml}</div><div class="section-title">📋 入退室ログ</div><div class="tbl-wrap"><table><tr><th>名前</th><th>クラス</th><th>入室</th><th>退室</th><th>滞在時間</th></tr>${rows||'<tr><td colspan="5" class="no-data">まだログイン記録がありません</td></tr>'}</table></div>`}
function formatSeconds(sec){if(!sec||sec<60)return'1分未満';const h=Math.floor(sec/3600);const m=Math.floor((sec%3600)/60);return h>0?`${h}時間${m}分`:`${m}分`}
function formatDurationFromDate(dateStr){if(!dateStr)return'';try{const ms=Date.now()-new Date(dateStr).getTime();return formatSeconds(Math.floor(ms/1000))}catch(e){return''}}
function renderAdminGameUsage(){if(!S.gameplay){loadGameplay().then(()=>render());return'<div class="no-data">読み込み中...</div>'}const perGame=S.gameplay.perGame||[];const perPlayer=S.gameplay.perPlayer||[];const maxPlays=perGame.length?Math.max(...perGame.map(g=>g.total_plays)):1;const gameRows=perGame.length?perGame.map(g=>{const pct=Math.round(g.total_plays/maxPlays*100);return`<div class="usage-bar-row"><div class="usage-bar-label">${esc(g.emoji)} ${esc(g.game_name)}</div><div class="usage-bar-track"><div class="usage-bar-fill" style="width:${pct}%"></div></div><div class="usage-bar-val">${g.total_plays}回 / ${g.unique_players}人${g.total_duration?'<br>'+formatSeconds(g.total_duration):''}</div></div>`}).join(''):'<div class="no-data">まだプレイ記録がありません</div>';const playerCards=perPlayer.length?perPlayer.map(ps=>{return`<div style="background:var(--bg-card);border:1.5px solid rgba(0,0,0,0.06);border-radius:14px;padding:16px;margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div class="user-avatar" style="width:24px;height:24px;font-size:.7rem">${esc(ps.student_name.charAt(0))}</div><strong>${esc(ps.student_name)}</strong><span style="font-size:.65rem;color:var(--text-dim);background:rgba(0,0,0,0.04);padding:1px 8px;border-radius:10px">${esc(ps.class_name)}</span><span style="margin-left:auto;font-family:'Orbitron';font-size:.7rem;color:var(--accent-cyan)">${ps.total_plays}回${ps.total_duration?' / '+formatSeconds(ps.total_duration):''}</span></div></div>`}).join(''):'<div class="no-data">まだプレイ記録がありません</div>';return`<div class="section-title">🎮 ゲーム別プレイ回数・時間</div><div style="background:var(--bg-card);border:1.5px solid rgba(0,0,0,0.06);border-radius:14px;padding:16px;margin-bottom:20px">${gameRows}</div><div class="section-title">👤 生徒別ゲーム利用状況</div>${playerCards}`}

function renderPortalRanking(){
  const ranking=S.rankings||[];
  // Global ranking
  const globalHtml=ranking.slice(0,10).map((r,i)=>{
    const cls=i===0?' rank-gold':i===1?' rank-silver':i===2?' rank-bronze':'';
    const num=i<3?'<div class="rank-medal">'+(i===0?'👑':i===1?'🥈':'🥉')+'</div>':'<div class="rank-num">'+(i+1)+'</div>';
    const isMe=S.user&&r.student_name===S.user.name&&i>=3?' style="border-color:rgba(0,229,255,0.25)"':'';
    return`<div class="rank-item${cls}"${isMe}>${num}<div class="rank-name">${esc(r.student_name||r.name||'')}<span style="font-size:.65rem;color:var(--text-dim);margin-left:6px">${esc(r.class_name||'')}</span></div><div class="rank-alt">${r.total_coins||0} ALT</div></div>`;
  }).join('');

  // Game-specific rankings - group by game
  const byGame={};
  (S.rankings||[]).forEach(r=>{if(r.game_name){const k=r.game_name;if(!byGame[k])byGame[k]={name:k,emoji:r.game_emoji||'🎮',id:r.game_id,entries:[]};byGame[k].entries.push(r)}});
  const gamesWithRank=Object.values(byGame);
  if(!S.selectedRankGame&&gamesWithRank.length>0)S.selectedRankGame=gamesWithRank[0].id;
  const gameTabsHtml=gamesWithRank.map(g=>
    `<button class="game-rank-tab ${S.selectedRankGame===g.id?'active':''}" data-rgid="${g.id}">${g.emoji} ${esc(g.name)}</button>`
  ).join('');

  let gameRankContent='<div style="color:var(--text-dim);font-size:.85rem;text-align:center;padding:20px">まだゲームの記録がありません</div>';
  if(S.selectedRankGame){
    const selGame=gamesWithRank.find(g=>g.id===S.selectedRankGame);
    if(selGame&&selGame.entries.length>0){
      const rows=selGame.entries.slice(0,10).map((r,i)=>{
        const medal=i===0?'👑':i===1?'🥈':i===2?'🥉':'';
        const numStr=medal?`<span style="font-size:1.1rem">${medal}</span>`:`<span style="font-family:'Orbitron';font-size:.8rem;color:var(--text-dim)">${i+1}</span>`;
        const isMe=S.user&&r.student_name===S.user.name?'style="background:rgba(0,144,217,0.05);border-color:rgba(0,229,255,0.2)"':'';
        return`<tr ${isMe}><td style="width:40px;text-align:center">${numStr}</td><td><strong>${esc(r.student_name)}</strong></td><td class="game-rank-table"><span class="rank-score">${esc(r.score)}</span><span class="score-label">${esc(r.score_label||'')}</span></td></tr>`;
      }).join('');
      gameRankContent=`<div class="tbl-wrap game-rank-table"><table><tr><th>#</th><th>プレイヤー</th><th>スコア</th></tr>${rows}</table></div>`;
    }
  }

  return`<div class="section-title">🏆 総合ランキング</div>
    <div class="ranking-section"><div class="ranking-list">${globalHtml||'<div class="no-data">まだ記録がありません</div>'}</div></div>
    <div class="section-title" style="margin-top:10px">🎮 ゲーム別ランキング</div>

}

function renderAdminLoginLog(){
  if(!S.loginLogs.length){loadLoginLogs().then(()=>render());return'<div class="no-data">読み込み中...</div>'}
  // Active sessions (no logout)
  const active=S.loginLogs.filter(l=>!l.logout_at);
  const onlineHtml=active.length?active.map(s=>{
    const dur=formatDurationFromDate(s.login_at);
    return`<div class="online-chip"><span class="online-dot"></span>${esc(s.student_name)}<span style="font-size:.65rem;color:var(--text-dim)">${esc(s.class_name)}</span><span class="duration-badge">${dur}</span></div>`;
  }).join(''):'<div style="color:var(--text-dim);font-size:.85rem">現在オンラインのユーザーはいません</div>';

  const rows=S.loginLogs.slice(0,100).map(s=>{
    const dur=s.duration_seconds?formatSeconds(s.duration_seconds):(s.logout_at?'—':`<span style="color:var(--accent-green)">滞在中</span>`);
    return`<tr><td>${esc(s.student_name)}</td><td><span style="font-size:.75rem;color:var(--text-dim)">${esc(s.class_name)}</span></td><td style="font-size:.8rem">${esc(s.login_at||'')}</td><td style="font-size:.8rem">${s.logout_at?esc(s.logout_at):'—'}</td><td class="duration-badge">${dur}</td></tr>`;
  }).join('');

  return`
    <div class="section-title">🟢 現在オンライン（${active.length}名）</div>
    <div class="online-list">${onlineHtml}</div>
    <div class="section-title">📋 入退室ログ</div>
    <div class="tbl-wrap"><table>
      <tr><th>名前</th><th>クラス</th><th>入室</th><th>退室</th><th>滞在時間</th></tr>
      ${rows||'<tr><td colspan="5" class="no-data">まだログイン記録がありません</td></tr>'}
    </table></div>`;
}

function formatSeconds(sec){
  if(!sec||sec<60)return'1分未満';
  const h=Math.floor(sec/3600);const m=Math.floor((sec%3600)/60);
  return h>0?`${h}時間${m}分`:`${m}分`;
}
function formatDurationFromDate(dateStr){
  if(!dateStr)return'';
  try{const ms=Date.now()-new Date(dateStr).getTime();return formatSeconds(Math.floor(ms/1000))}catch(e){return''}
}

// ═══ ゲーム利用状況 ═══
function renderAdminGameUsage(){
  if(!S.gameplay){loadGameplay().then(()=>render());return'<div class="no-data">読み込み中...</div>'}
  const perGame=S.gameplay.perGame||[];
  const perPlayer=S.gameplay.perPlayer||[];
  const maxPlays=perGame.length?Math.max(...perGame.map(g=>g.total_plays)):1;

  const gameRows=perGame.length?perGame.map(g=>{
    const pct=Math.round(g.total_plays/maxPlays*100);
    return`<div class="usage-bar-row">
      <div class="usage-bar-label">${esc(g.emoji)} ${esc(g.game_name)}</div>
      <div class="usage-bar-track"><div class="usage-bar-fill" style="width:${pct}%"></div></div>
      <div class="usage-bar-val">${g.total_plays}回 / ${g.unique_players}人${g.total_duration?'<br>'+formatSeconds(g.total_duration):''}</div>
    </div>`;
  }).join(''):'<div class="no-data">まだプレイ記録がありません</div>';

  const playerCards=perPlayer.length?perPlayer.map(ps=>{
    return`<div style="background:var(--bg-card);border:1.5px solid rgba(0,0,0,0.06);border-radius:14px;padding:16px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">

        <span style="margin-left:auto;font-family:'Orbitron';font-size:.7rem;color:var(--accent-cyan)">${ps.total_plays}回${ps.total_duration?' / '+formatSeconds(ps.total_duration):''}</span>
      </div>
    </div>`;
  }).join(''):'<div class="no-data">まだプレイ記録がありません</div>';

  return`
    <div class="section-title">🎮 ゲーム別プレイ回数・時間</div>

  document.querySelectorAll('.cat-btn:not(.comment-tpl)').forEach(b=>{b.onclick=()=>{S.selectedCategory=b.dataset.cat;render()}});
  document.querySelectorAll('.game-rank-tab').forEach(t=>{t.onclick=()=>{S.selectedRankGame=parseInt(t.dataset.rgid);render()}});
  document.querySelectorAll('.game-card[href]').forEach(a=>{a.addEventListener('click',()=>{const gid=a.dataset.gid;const g=S.games.find(g=>String(g.id)===gid);if(g&&S.user){gamePlayTracker.startPlay(S.user.name,g.id,g.name);if(S.user.role==='student'&&S.tenant){apiPost('/play-sessions/start',{tenant_id:S.tenant.id,student_id:S.user.id,game_id:g.id}).then(r=>{if(r.session_id)S._activeSessionId=r.session_id}).catch(()=>{})}}})});
  document.querySelectorAll('.admin-tab').forEach(t=>{t.onclick=()=>{S.adminTab=t.dataset.tab;S.dashboard=null;if(t.dataset.tab!=='summary')S.parentTokens=null;render()}});
  on('refreshBtn','click',()=>{S.dashboard=null;loadTenantData()});
  on('addCoinBtn','click',async()=>{const sid=val('coinStudent'),gid=val('coinGame'),amt=parseInt(val('coinAmount'));if(!sid||!amt||amt<1)return;try{await apiPost('/t/'+S.tenant.slug+'/coins',{studentId:parseInt(sid),gameId:parseInt(gid),amount:amt});toast('🪙 ALT付与しました！');await loadTenantData()}catch(e){toast(e.message)}});
  on('addStudentBtn','click',async()=>{const name=val('newStudentName'),cls=val('newStudentClass');if(!name||!cls){toast('名前とクラスを入力');return}try{await apiPost('/t/'+S.tenant.slug+'/students',{name,className:cls});toast('✅ '+name+'を追加');await loadTenantData()}catch(e){toast(e.message)}});
  on('addBadgeBtn','click',async()=>{const sid=val('badgeStudent');if(!sid)return;try{await apiPost('/t/'+S.tenant.slug+'/badges',{studentId:parseInt(sid)});toast('🏅 バッジ付与！');await loadTenantData()}catch(e){toast(e.message)}});
  on('addGameBtn','click',async()=>{const name=val('newGameName');if(!name)return;const url=val('newGameUrl'),emoji=val('newGameEmoji')||'🎮',cat=val('newGameCat');const urlErr=validateUrl(url);if(urlErr){toast(urlErr);return}try{await apiPost('/t/'+S.tenant.slug+'/games',{name,emoji,url,category:cat});toast('✅ '+name+'を追加');await loadTenantData()}catch(e){toast(e.message)}});
  document.querySelectorAll('[data-del-game]').forEach(b=>{b.onclick=async()=>{if(!confirm('このゲームを削除しますか？'))return;try{await apiDel('/t/'+S.tenant.slug+'/games/'+b.dataset.delGame);toast('削除しました');await loadTenantData()}catch(e){toast(e.message)}}});
  document.querySelectorAll('[data-save-game]').forEach(b=>{b.onclick=async()=>{const gid=b.dataset.saveGame;const input=document.querySelector('[data-url-game="'+gid+'"]');const url=input?input.value.trim():'';const urlErr=validateUrl(url);if(urlErr){toast(urlErr);return}try{await apiPut('/t/'+S.tenant.slug+'/games/'+gid,{url});toast('URL保存しました');await loadTenantData()}catch(e){toast(e.message)}}});
  document.querySelectorAll('[data-del-rank]').forEach(b=>{b.onclick=async()=>{if(!confirm('この記録を削除しますか？'))return;try{await apiDel('/t/'+S.tenant.slug+'/rankings/'+b.dataset.delRank);toast('削除しました');await loadTenantData()}catch(e){toast(e.message)}}});
  on('addClassBtn','click',async()=>{const name=val('newClassName');if(!name)return;try{await apiPost('/t/'+S.tenant.slug+'/classes',{name});toast('🏫 '+name+'を追加');await loadTenantData()}catch(e){toast(e.message)}});
  document.querySelectorAll('[data-del-cls]').forEach(b=>{b.onclick=async()=>{if(!confirm('このクラスを削除しますか？'))return;try{await apiDel('/t/'+S.tenant.slug+'/classes/'+b.dataset.delCls);toast('削除しました');await loadTenantData()}catch(e){toast(e.message)}}});
  document.querySelectorAll('[data-parent-link]').forEach(b=>{b.onclick=async()=>{const sid=parseInt(b.dataset.parentLink);const sname=b.dataset.sname||'';try{const r=await apiPost('/parent-tokens',{tenant_id:S.tenant.id,student_id:sid});const url=location.origin+r.url;if(navigator.clipboard){await navigator.clipboard.writeText(url);toast('📩 '+sname+'の保護者リンクをコピーしました！')}else{prompt('以下のURLをコピーしてください:',url)}}catch(e){toast('エラー: '+e.message)}}});
  document.querySelectorAll('.comment-tpl').forEach(b=>{b.onclick=()=>{const inp=document.getElementById('commentText');if(inp)inp.value=b.dataset.tpl}});
  on('refreshTokensBtn','click',()=>{S.parentTokens=null;render()});
  document.querySelectorAll('[data-copy-token]').forEach(b=>{b.onclick=async()=>{const url=b.dataset.copyToken;if(navigator.clipboard){await navigator.clipboard.writeText(url);toast('📋 URLをコピーしました')}else{prompt('URLをコピー:',url)}}});
  document.querySelectorAll('[data-revoke-token]').forEach(b=>{b.onclick=async()=>{const id=b.dataset.revokeToken;const sname=b.dataset.sname||'この生徒';if(!confirm(sname+'の保護者リンクを無効化しますか？'))return;try{await apiDel('/parent-tokens/'+id);toast('🗑 '+sname+'の保護者リンクを無効化しました');S.parentTokens=null;render()}catch(e){toast('エラー: '+e.message)}}});
  on('saveCommentBtn','click',async()=>{const sid=val('commentStudent'),text=val('commentText');if(!sid||!text){toast('生徒とコメントを入力してください');return}const now=new Date();const month=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');try{await apiPost('/teacher-comments',{tenant_id:S.tenant.id,student_id:parseInt(sid),comment:text,month});toast('💬 コメントを保存しました');document.getElementById('commentText').value=''}catch(e){toast('エラー: '+e.message)}});
  on('issueParentPinBtn','click',async()=>{
    const sid=val('parentPinStudent');if(!sid)return;
    try{
      const r=await apiPost('/auth/parent-tokens',{studentId:parseInt(sid)});
      const url=location.origin+'/';
      const msg=`【TRAIL GAME PRO 3 保護者ログイン】\nお子さま: ${r.student.name}（${r.student.className}）\nPIN: ${r.pin}\nログインURL: ${url}\n※ログイン画面で「ほごしゃ」タブを選び、お子さまの名前とPINを入力してください。`;
      const box=document.getElementById('parentPinResult');
      box.innerHTML=`<div style="margin-top:14px;background:rgba(0,144,217,0.06);border:1.5px solid rgba(0,144,217,0.2);border-radius:10px;padding:14px">
        <div style="font-family:'Orbitron',sans-serif;font-size:.65rem;color:var(--accent-cyan);margin-bottom:8px;letter-spacing:1px">PIN発行完了</div>
        <div style="font-size:.85rem;font-weight:700;margin-bottom:4px">${esc(r.student.name)}（${esc(r.student.className)}）</div>
        <div style="font-family:'Orbitron',sans-serif;font-size:1.6rem;font-weight:900;letter-spacing:8px;color:var(--accent-purple);margin:8px 0">${esc(r.pin)}</div>
        <button class="btn-primary btn-purple" id="copyPinBtn" style="font-size:.7rem;padding:10px">📋 LINEやメール用にコピー</button>
      </div>`;
      document.getElementById('copyPinBtn').onclick=()=>{
        navigator.clipboard.writeText(msg).then(()=>toast('コピーしました！LINEやメールに貼り付けてください')).catch(()=>{prompt('以下をコピーしてください:',msg)});
      };
    }catch(e){toast('PIN発行エラー: '+e.message)}
  });
}
function on(id,ev,fn){const el=document.getElementById(id);if(el)el.addEventListener(ev,fn)}
function val(id){const el=document.getElementById(id);return el?el.value.trim():''}
createStars();

// ★ 0-15: ページ復帰時にデータ更新（ゲームから戻ったとき）
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    // セッションが消えていたらバックアップから復元
    if(!S.token||!S.user){const d=AUTH.load();if(d&&d.token){S.token=d.token;S.tenant=d.tenant;S.user=d.user;S.screen=d.screen||'portal';render()}}
    // アクティブなプレイセッションを終了（ALT記録）→ 完了後にデータ再取得
    if(S._activeSessionId&&S.token){
      const sid=S._activeSessionId;S._activeSessionId=null;
      // 外部ゲームはPOST /api/external/game-resultで自身のセッションを作成しALTを記録する
      // ポータル側のセッションはスコアデータなし(skip_alt=true)で閉じるだけにする
      api('PATCH','/play-sessions/'+sid+'/end',{score:null,correct_count:null,total_count:null,skip_alt:true}).then(r=>{
        if(r.alt&&(r.alt.total>0||(r.alt.capInfo&&r.alt.capInfo.capped)))showAltPopup(r.alt);
        // セッション終了完了後にデータ再取得してヘッダー更新
        if(S.user&&S.tenant){loadTenantData();if(S.user.role==='student')loadStreak()}
      }).catch(()=>{
        if(S.user&&S.tenant){loadTenantData();if(S.user.role==='student')loadStreak()}
      });
    } else if(S.user&&S.tenant){
      // アクティブセッションがない場合は即座にデータ再取得
      loadTenantData();if(S.user.role==='student')loadStreak()
    }
  }
});

// 🆕 URLパラメータでトークンを受け取った場合もデータ読み込み（refresh_alt対応）
if(S.token&&S.tenant){loadTenantData().then(()=>{if(_needRefreshAlt){_needRefreshAlt=false;toast('💰 ALT残高を更新しました')}})}else{render()}
</script>
