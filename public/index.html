<style>
*{margin:0;padding:0;box-sizing:border-box}

<body>
<div class="stars" id="stars"></div>
<div class="toast" id="toast"></div>
<div class="app" id="app"></div>
<script>
// ═══════════════════════════════════════
// TRAIL GAME PRO 3 SaaS - Frontend SPA
// ═══════════════════════════════════════
const CATEGORIES=['算数','地理','歴史','理科','国語','その他'];
const CAT_EMOJI={'算数':'🔢','地理':'🗾','歴史':'🏯','理科':'🔬','国語':'📖','その他':'🎮'};

// ═══ XSS対策 ═══
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

// ═══ セッション管理 ═══
const AUTH={
  KEY:'trail_saas_auth',
  save(data){try{sessionStorage.setItem(this.KEY,JSON.stringify(data))}catch(e){}},
  load(){try{return JSON.parse(sessionStorage.getItem(this.KEY))}catch(e){return null}},
  clear(){try{sessionStorage.removeItem(this.KEY)}catch(e){}},
  getToken(){const d=this.load();return d?d.token:null}
};

// ═══ API通信 ═══
const API_BASE='/api';
async function api(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json'}};
  const tk=AUTH.getToken();
  if(tk)opts.headers['Authorization']='Bearer '+tk;
  if(body)opts.body=JSON.stringify(body);
  const res=await fetch(API_BASE+path,opts);
  const json=await res.json();
  if(!res.ok)throw new Error(json.error||'API Error');
  return json;
}
function apiGet(p){return api('GET',p)}
function apiPost(p,b){return api('POST',p,b)}
function apiPut(p,b){return api('PUT',p,b)}
function apiDel(p){return api('DELETE',p)}

// ═══ State ═══
let S={
  screen:'landing', // landing|student-login|admin-login|portal|guest|admin|register
  tenant:null, // {id,name,slug,plan}
  user:null,   // admin: {id,email,displayName,role} | student: {id,name,className}
  token:null,
  // Data
  games:[],classes:[],students:[],coinLogs:[],badges:[],rankings:[],
  // UI
  adminTab:'activity',portalTab:'home',selectedCategory:'すべて',
  selectedRankGame:null,loginClass:null,loading:false,
  // Analytics cache
  dashboard:null,loginLogs:[],gameplay:null,
};

// ═══ Restore session ═══
(function restore(){
  const d=AUTH.load();
  if(!d)return;

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

// ═══ Stars ═══
function createStars(){const c=document.getElementById('stars');for(let i=0;i<50;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';s.style.animationDuration=(2+Math.random()*3)+'s';s.style.width=s.style.height=(1+Math.random()*2)+'px';c.appendChild(s)}}

// ═══ Data Loading ═══
async function loadTenantData(){
  if(!S.tenant)return;
  const slug=S.tenant.slug;
  S.loading=true;render();
  try{
    const [gRes,cRes]=await Promise.all([
      apiGet('/t/'+slug+'/games'),
      apiGet('/t/'+slug+'/classes')
    ]);
    S.games=gRes.games||[];
    S.classes=cRes.classes||[];
    // Load rankings
    try{const rRes=await apiGet('/t/'+slug+'/rankings');S.rankings=rRes.rankings||[]}catch(e){}
    // Admin-only data
    if(S.user&&S.user.role&&S.user.role!=='student'){
      try{
        const [sRes,coRes,bRes]=await Promise.all([
          apiGet('/t/'+slug+'/students'),
          apiGet('/t/'+slug+'/coins'),
          apiGet('/t/'+slug+'/badges')
        ]);
        S.students=sRes.students||[];
        S.coinLogs=coRes.logs||[];
        S.badges=bRes.summary||[];
      }catch(e){console.error(e)}
    } else if(S.user&&S.user.role==='student'){
      try{const coRes=await apiGet('/t/'+slug+'/coins');S.coinLogs=coRes.logs||[]}catch(e){}
    }
  }catch(e){console.error('loadData:',e);toast('データ読み込みエラー')}
  S.loading=false;render();
}

async function loadDashboard(){
  if(!S.tenant)return;
  try{S.dashboard=await apiGet('/t/'+S.tenant.slug+'/analytics/dashboard')}catch(e){}
}
async function loadLoginLogs(){
  if(!S.tenant)return;
  try{const r=await apiGet('/t/'+S.tenant.slug+'/analytics/logins');S.loginLogs=r.logs||[]}catch(e){}
}
async function loadGameplay(){
  if(!S.tenant)return;
  try{S.gameplay=await apiGet('/t/'+S.tenant.slug+'/analytics/gameplay')}catch(e){}
}

// ═══ Helpers ═══
function getStudentCoins(name){return S.coinLogs.filter(l=>l.student_name===name).reduce((s,l)=>s+l.amount,0)}
function getStudentGameCoins(name,gid){return S.coinLogs.filter(l=>l.student_name===name&&l.game_id===gid).reduce((s,l)=>s+l.amount,0)}
function getStudentBadges(name){const b=S.badges.find(b=>b.student_name===name);return b?b.badge_count:0}
function findStudentById(id){return S.students.find(s=>s.id===id)}

  const items=S.games.map(g=>`<div class="game-list-item" style="flex-wrap:wrap">
    <div class="game-list-item-info"><span>${esc(g.emoji)}</span><div><strong>${esc(g.name)}</strong>${g.category?`<span class="game-item-cat">${esc(g.category)}</span>`:''}</div></div>
    <button class="delete-btn" data-del-game="${g.id}">削除</button>
    <div style="width:100%;display:flex;gap:6px;margin-top:6px;align-items:center">
      <input class="url-edit" data-url-game="${g.id}" value="${esc(g.url||'')}" placeholder="URLを入力..." style="flex:1;padding:6px 10px;background:rgba(0,0,0,0.02);border:1.5px solid rgba(0,0,0,0.08);border-radius:6px;font-size:.75rem;font-family:inherit;color:var(--text-primary);outline:none"/>
      <button class="url-save-btn" data-save-game="${g.id}" style="padding:6px 12px;background:var(--accent-cyan);border:none;border-radius:6px;color:#fff;font-size:.7rem;font-weight:700;cursor:pointer;white-space:nowrap">保存</button>
    </div>
  </div>`).join('');
  return`<div class="game-manage-form">
    <h3>🎮 ADD GAME</h3>
    <div class="form-stack">
      <div class="form-row-2">
        <div class="form-group"><label>ゲーム名</label><input type="text" id="newGameName" placeholder="ゲーム名"/></div>
        <div class="form-group"><label>カテゴリ</label><select id="newGameCat">${catOpts}</select></div>
      </div>
      <div class="form-group"><label>リンクURL</label><input type="text" id="newGameUrl" placeholder="https://..."/></div>
      <div class="form-group"><label>絵文字</label><input type="text" id="newGameEmoji" placeholder="🎲" maxlength="2" style="text-align:center"/></div>
      <button class="btn-primary btn-green" id="addGameBtn">追加</button>
    </div>
  </div>
  <div class="section-title">登録済みゲーム</div>
  <div class="game-list-admin">${items}</div>`;
}

function renderAdminRankings(){
  if(!S.rankings||S.rankings.length===0){
    return`<div class="no-data" style="background:var(--bg-card);border-radius:12px;padding:30px"><div style="font-size:2rem;margin-bottom:10px">🎮</div>まだゲームランキングの記録がありません。</div>`;
  }
  // Group by game
  const byGame={};
  S.rankings.forEach(r=>{const k=r.game_name||'unknown';if(!byGame[k])byGame[k]={name:k,emoji:r.game_emoji||'🎮',entries:[]};byGame[k].entries.push(r)});
  const sections=Object.values(byGame).map(g=>{
    const rows=g.entries.slice(0,20).map((r,i)=>{
      const medal=i===0?'👑':i===1?'🥈':i===2?'🥉':'';
      return`<tr><td style="text-align:center">${medal||(i+1)}</td><td><strong>${esc(r.student_name)}</strong></td><td><span class="rank-score">${esc(r.score)}</span><span class="score-label">${esc(r.score_label||'')}</span></td><td><button class="delete-btn" data-del-rank="${r.id}" style="font-size:.6rem;padding:2px 8px">削除</button></td></tr>`;
    }).join('');
    return`<div style="margin-bottom:20px"><div class="section-title">${g.emoji} ${esc(g.name)}（${g.entries.length}人）</div><div class="tbl-wrap"><table><tr><th>#</th><th>プレイヤー</th><th>スコア</th><th></th></tr>${rows}</table></div></div>`;
  }).join('');
  return`<div class="game-manage-form"><h3 style="color:var(--accent-cyan)">🏆 GAME RANKINGS</h3></div>${sections}`;
}

function renderAdminSummary(){
  const sorted=[...S.students].sort((a,b)=>(b.totalCoins||0)-(a.totalCoins||0));
  const rows=sorted.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td style="font-size:.7rem;color:var(--text-dim)">${esc(s.className)}</td><td class="total-coins">${s.totalCoins||0}</td><td style="text-align:center;color:var(--accent-orange)">${(s.totalBadges||0)>0?'🏅'+s.totalBadges:'—'}</td></tr>`).join('');
  const clsTags=S.classes.map(c=>`<span class="cat-tag">${esc(c.name)}<button class="cat-del" data-del-cls="${c.id}">✕</button></span>`).join('');
  return`<div class="section-title">📊 全生徒一覧</div>
    <div class="tbl-wrap"><table><tr class="summary-th"><th>生徒</th><th>クラス</th><th>ALT</th><th>🏅</th></tr>${rows||'<tr><td colspan="4" class="no-data">生徒がいません</td></tr>'}</table></div>
    <div class="cat-manage-form" style="margin-top:20px">
      <h3>🏫 クラス管理</h3>
      <div class="form-stack">
        <div class="form-group"><label>新しいクラス</label><input type="text" id="newClassName" placeholder="クラス名"/></div>
        <button class="btn-primary btn-purple" id="addClassBtn">追加</button>
      </div>
      <div class="cat-list">${clsTags}</div>
    </div>`;
}

// ════════════════════════════════════
// EVENTS
// ════════════════════════════════════
function bindEvents(){
  // Landing - Go to tenant
  on('goTenantBtn','click',async()=>{
    const slug=val('slugInput');if(!slug){toast('教室IDを入力してください');return}
    try{
      const r=await apiGet('/t/'+slug+'/info');
      S.tenant=r.tenant;
      const cRes=await apiGet('/t/'+slug+'/classes');
      S.classes=cRes.classes||[];
      try{const gRes=await apiGet('/t/'+slug+'/games');S.games=gRes.games||[]}catch(e){}
      S.screen='student-login';render();
    }catch(e){toast('教室が見つかりません: '+e.message)}
  });
  on('registerLink','click',()=>{S.screen='register';render()});
  on('backToLanding','click',()=>{S.screen='landing';render()});

  // Register
  on('registerBtn','click',async()=>{
    const name=val('regName'),slug=val('regSlug'),email=val('regEmail'),pass=val('regPass'),display=val('regDisplay');
    if(!name||!slug||!email||!pass){toast('全項目を入力してください');return}
    try{
      const r=await apiPost('/auth/register',{tenantName:name,slug,email,password:pass,displayName:display||name});
      S.token=r.token;S.tenant=r.tenant;S.user={email,displayName:display||name,role:'owner'};S.screen='admin';
      AUTH.save({token:S.token,tenant:S.tenant,user:S.user,screen:'admin'});
      await loadTenantData();toast('教室を作成しました！');
    }catch(e){toast('登録エラー: '+e.message)}
  });

  // Student login - class select
  document.querySelectorAll('.class-select-btn').forEach(b=>{b.onclick=()=>{S.loginClass=b.dataset.cls;render()}});
  on('loginBtn','click',async()=>{
    const name=val('nameInput');if(!name){toast('なまえをいれてね');return}
    try{
      const r=await apiPost('/auth/student/login',{tenantSlug:S.tenant.slug,className:S.loginClass,studentName:name});
      S.token=r.token;S.user={id:r.student.id,name:r.student.name,className:r.student.className,role:'student'};S.screen='portal';
      AUTH.save({token:S.token,tenant:S.tenant,user:S.user,screen:'portal'});
      await loadTenantData();
    }catch(e){toast(e.message)}
  });
  const ni=document.getElementById('nameInput');if(ni){ni.onkeydown=e=>{if(e.key==='Enter'){const b=document.getElementById('loginBtn');if(b)b.click()}};ni.focus()}

  // Guest
  on('guestLink','click',()=>{S.screen='guest';render()});
  // Admin link
  on('adminLink','click',()=>{S.screen='admin-login';render()});
  on('backToStudentLogin','click',()=>{S.screen='student-login';render()});

  // Admin login
  on('adminLoginBtn','click',async()=>{
    const email=val('adminEmail'),pass=val('adminPass');
    if(!email||!pass){toast('入力してください');return}
    try{
      const r=await apiPost('/auth/admin/login',{email,password:pass});
      S.token=r.token;S.tenant=r.tenant;S.user={...r.user,role:r.user.role};S.screen='admin';
      AUTH.save({token:S.token,tenant:S.tenant,user:S.user,screen:'admin'});
      await loadTenantData();
    }catch(e){toast(e.message)}
  });

  // Logout
  on('logoutBtn','click',()=>{S.token=null;S.user=null;S.dashboard=null;S.coinLogs=[];S.students=[];S.badges=[];AUTH.clear();S.screen=S.tenant?'student-login':'landing';render()});

  // Portal tabs
  document.querySelectorAll('.portal-tab').forEach(t=>{t.onclick=()=>{S.portalTab=t.dataset.ptab;render()}});
  // Category filter
  document.querySelectorAll('.cat-btn').forEach(b=>{b.onclick=()=>{S.selectedCategory=b.dataset.cat;render()}});
  // Admin tabs
  document.querySelectorAll('.admin-tab').forEach(t=>{t.onclick=()=>{S.adminTab=t.dataset.tab;S.dashboard=null;render()}});
  // Refresh
  on('refreshBtn','click',()=>{S.dashboard=null;loadTenantData()});

  // Add coin
  on('addCoinBtn','click',async()=>{
    const sid=val('coinStudent'),gid=val('coinGame'),amt=parseInt(val('coinAmount'));
    if(!sid||!amt||amt<1)return;
    try{
      await apiPost('/t/'+S.tenant.slug+'/coins',{studentId:parseInt(sid),gameId:parseInt(gid),amount:amt});
      toast('🪙 ALT付与しました！');await loadTenantData();
    }catch(e){toast(e.message)}
  });

  // Add student
  on('addStudentBtn','click',async()=>{
    const name=val('newStudentName'),cls=val('newStudentClass');
    if(!name||!cls){toast('名前とクラスを入力');return}
    try{
      await apiPost('/t/'+S.tenant.slug+'/students',{name,className:cls});
      toast('✅ '+name+'を追加');await loadTenantData();
    }catch(e){toast(e.message)}
  });

  // Add badge
  on('addBadgeBtn','click',async()=>{
    const sid=val('badgeStudent');if(!sid)return;
    try{
      await apiPost('/t/'+S.tenant.slug+'/badges',{studentId:parseInt(sid)});
      toast('🏅 バッジ付与！');await loadTenantData();
    }catch(e){toast(e.message)}
  });

  // Add game
  on('addGameBtn','click',async()=>{
    const name=val('newGameName');if(!name)return;
    const url=val('newGameUrl'),emoji=val('newGameEmoji')||'🎮',cat=val('newGameCat');
    try{
      await apiPost('/t/'+S.tenant.slug+'/games',{name,emoji,url,category:cat});
      toast('✅ '+name+'を追加');await loadTenantData();
    }catch(e){toast(e.message)}
  });

  // Delete game
  document.querySelectorAll('[data-del-game]').forEach(b=>{b.onclick=async()=>{
    if(!confirm('このゲームを削除しますか？'))return;
    try{await apiDel('/t/'+S.tenant.slug+'/games/'+b.dataset.delGame);toast('削除しました');await loadTenantData()}catch(e){toast(e.message)}
  }});

  // Save game URL
  document.querySelectorAll('[data-save-game]').forEach(b=>{b.onclick=async()=>{
    const gid=b.dataset.saveGame;
    const input=document.querySelector('[data-url-game="'+gid+'"]');
    const url=input?input.value.trim():'';
    try{await apiPut('/t/'+S.tenant.slug+'/games/'+gid,{url});toast('URL保存しました');await loadTenantData()}catch(e){toast(e.message)}
  }});

  // Delete ranking
  document.querySelectorAll('[data-del-rank]').forEach(b=>{b.onclick=async()=>{
    if(!confirm('この記録を削除しますか？'))return;
    try{await apiDel('/t/'+S.tenant.slug+'/rankings/'+b.dataset.delRank);toast('削除しました');await loadTenantData()}catch(e){toast(e.message)}
  }});

  // Add class
  on('addClassBtn','click',async()=>{
    const name=val('newClassName');if(!name)return;
    try{await apiPost('/t/'+S.tenant.slug+'/classes',{name});toast('🏫 '+name+'を追加');await loadTenantData()}catch(e){toast(e.message)}
  });

  // Delete class
  document.querySelectorAll('[data-del-cls]').forEach(b=>{b.onclick=async()=>{
    if(!confirm('このクラスを削除しますか？'))return;
    try{await apiDel('/t/'+S.tenant.slug+'/classes/'+b.dataset.delCls);toast('削除しました');await loadTenantData()}catch(e){toast(e.message)}
  }});
}

// ═══ Utility ═══
function on(id,ev,fn){const el=document.getElementById(id);if(el)el.addEventListener(ev,fn)}
function val(id){const el=document.getElementById(id);return el?el.value.trim():''}

// ═══ Boot ═══
createStars();
if(S.token&&S.tenant){loadTenantData()}else{render()}
</script>
</body>
</html>
